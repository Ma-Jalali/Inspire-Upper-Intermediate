    case 'tasklist': return 'Task list';
    case 'quiz': return 'Quiz: '+(b.title||'Quick check');
    case 'toggle': return 'Toggle: '+(b.title||'Untitled');
    case 'table': return 'Table';
    case 'callout': return 'Banner: '+stripHtmlPreview(b.text);
    case 'quote': return 'Quote: '+stripHtmlPreview(b.text);
    case 'image': return 'Image: '+(b.label||'Untitled image');
    case 'embed': return 'Video: '+(b.label||'Untitled media');
    case 'audio': return 'Audio: '+(b.label||'Untitled audio');
    case 'clip': return 'Video (Supabase): '+(b.label||'Untitled video');
    case 'divider': return 'Divider';
    case 'timer': return 'Timer: '+(b.label||'Timed task');
    case 'gallery': return 'Gallery: '+((b.imgKeys||[]).length)+' images';
    case 'tabs': return 'Tabs: '+((b.blocks||[]).map(function(t){ return t.title; }).join(' / '));

function collectSubtreeIds(block, out){
  out.push(block.id);
  if(isContainer(block)){ block.blocks.forEach(function(c){ collectSubtreeIds(c, out); }); }
}
function flattenBlocksForMove(blocks, depth, out, excludeIds){
  blocks.forEach(function(b){
    if(excludeIds.indexOf(b.id)!==-1) return;
    out.push({ id:b.id, depth:depth, label: blockPreviewLabel(b) });
    if(isContainer(b)) flattenBlocksForMove(b.blocks, depth+1, out, excludeIds);
  });
}
function flattenAllPages(pages, trail, out){
  pages.forEach(function(p){
    out.push({ id:p.id, title:p.title, trail:trail.slice() });
    if(p.children && p.children.length) flattenAllPages(p.children, trail.concat([p.title]), out);
  });
}
function confirmMoveTo(targetId){
  const sourcePage = currentPage();
  const destPage = getMoveTargetPage();
  const loc = findBlockLocation(sourcePage.blocks, moveBlockId, []);
  if(!loc) return;
  const block = loc.arr.splice(loc.idx, 1)[0];
  if(!targetId){
    destPage.blocks.unshift(block);
  }else{
    const targetLoc = findBlockLocation(destPage.blocks, targetId, []);
    const idx = targetLoc.arr.findIndex(function(b){ return b.id===targetId; });
    targetLoc.arr.splice(idx+1, 0, block);
  }
  moveBlockId = null; moveTargetPageId = null; moveChoosingPage = false;
  persist(); render();
}
function currentPage(){
  if(!pageStack.length) return null;

function unitParts(title){

function collectImgKeys(blocks, out){
  blocks.forEach(function(b){
    if(b.type==='image' && b.imgKey) out.push(b.imgKey);
    if(b.imgKeys) b.imgKeys.forEach(function(k){ if(k) out.push(k); });
    if(isContainer(b)) collectImgKeys(b.blocks, out);
  });
}
function collectPageImgKeys(p, out){
  collectImgKeys(p.blocks||[], out);
  (p.children||[]).forEach(function(c){ collectPageImgKeys(c, out); });
}
function deleteImgKeys(keys){
  keys.forEach(function(k){

    delete imageCache[k];

/* ================= image compression & upload ================= */
function compressImageFile(file, maxW, quality, cb){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0,0,w,h);
      ctx.drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = function(){ alert('That file could not be read as an image.'); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function handleImageUpload(blockId, input){
  const file = input.files && input.files[0];
  if(!file) return;
  compressImageFile(file, 1000, 0.78, function(dataUrl){
    const key = 'img-'+uid();
    window.storage.set(key, dataUrl, true).then(function(){
      const page = currentPage();
      const node = findBlockNode(page.blocks, blockId);
      if(!node) return;
      if(node.imgKey){ deleteImgKeys([node.imgKey]); }
      node.imgKey = key;
      imageCache[key] = dataUrl;
      persist(); render();
    }).catch(function(){
      alert('The image could not be saved. It may be too large — try a smaller photo.');
    });
  });
}
function handleBookImage(input){
  const file = input.files && input.files[0];
  if(!file) return;
  compressImageFile(file, 160, 0.8, function(dataUrl){
    state.bookImg = dataUrl;

  });
}

function ensureImageLoaded(key){
  if(imageCache[key] || imagePending[key]) return;
  imagePending[key] = true;
  window.storage.get(key, true).then(function(res){
    imageCache[key] = res.value;
    delete imagePending[key];
    render();
  }).catch(function(){
    imageCache[key] = 'ERR';
    delete imagePending[key];
    render();
  });
}

/* ================= backup / restore ================= */
async function exportBackup(){
  try{
    const bundle = { state: state, images: {} };
    try{
      const listed = await window.storage.list('img-', true);
      const keys = (listed && listed.keys) ? listed.keys : [];
      for(const k of keys){
        const keyName = typeof k === 'string' ? k : k.key;
        try{
          const res = await window.storage.get(keyName, true);
          bundle.images[keyName] = res.value;
        }catch(e){}
      }
    }catch(e){}
    const blob = new Blob([JSON.stringify(bundle)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'class-hub-backup-'+new Date().toISOString().slice(0,10)+'.json';
    a.click();
  }catch(e){
    alert('Backup failed: '+e.message);
  }
}
function handleImportFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    try{
      const data = JSON.parse(e.target.result);
      const newState = data.state || data;
      if(!newState.pages || !Array.isArray(newState.pages)) throw new Error('Not a valid backup file.');
      if(!confirm('Replace ALL current content with this backup? This cannot be undone.')) return;
      state = newState;
      migrate();
      // A deliberate restore must always win over whatever is in the database.
      // Sync our known revision to the stored one so the version guard lets it through.
      try{
        const cur = await window.storage.get('page-tree', true);
        const remote = JSON.parse(cur.value);
        loadedRev = (remote.rev || 0);
      }catch(e){ loadedRev = (state.rev || 0); }
      await persist();
      if(data.images){
        for(const k in data.images){
          try{ await window.storage.set(k, data.images[k], true); imageCache[k]=data.images[k]; }catch(err){}
        }
      }
      render();
      alert('Backup restored.');
    }catch(err){
      alert('Could not import: '+err.message);
    }
  };
  reader.readAsText(file);
}

/* -ing words that are real nouns in their own right (meeting = an event,
   not just "the act of meeting"). Searching these shows the word itself —

const ING_NOUN_KEEP = ['meeting','feeling','building','wedding','morning','evening',
  'painting','drawing','clothing','housing','beginning','ending','meaning','warning',
  'training','ceiling','pudding','lightning','dumpling','sibling','darling'];

/* Pull the base verb out of definitions like "present participle of listen"
   or "past tense of think". */
function extractBaseVerb(){
  var base = null;
  (dictResult||[]).forEach(function(en){
    (en.meanings||[]).forEach(function(m){
      (m.definitions||[]).forEach(function(d){
        if(base) return;
        var mt = String(d.definition||'').match(/(?:participle|gerund|tense)\s+(?:and\s+past\s+participle\s+)?of\s+(?:the\s+verb\s+)?([a-z\-']+)/i);
        if(mt) base = mt[1].toLowerCase();

    });
  });

}
/* listening -> listen | making -> make | running -> run */
function ingBaseCandidates(q){
  var stem = q.slice(0, -3);

  if(stem.length >= 2){
    out.push(stem);
    out.push(stem + 'e');
    if(stem.length >= 3 && stem[stem.length-1] === stem[stem.length-2]) out.push(stem.slice(0, -1));
  }
  return out;
}
async function fetchEntryWithVerb(word){
  try{
    var r = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word));
    if(!r.ok) return null;
    var data = await r.json();
    if(!Array.isArray(data) || !data.length) return null;
    var hasVerb = data.some(function(en){
      return (en.meanings||[]).some(function(m){ return (m.partOfSpeech||'').toLowerCase()==='verb'; });
    });
    return hasVerb ? data : null;
  }catch(e){ return null; }
}
function filterMeanings(keepFn){
  dictResult = dictResult.map(function(en){
    var copy = {};
    for(var k in en){ if(Object.prototype.hasOwnProperty.call(en,k)) copy[k] = en[k]; }
    copy.meanings = (en.meanings||[]).filter(keepFn);
    return copy;
  }).filter(function(en){ return en.meanings && en.meanings.length; });
}
/* Shapes the raw lookup for B1 learners:
   - "excited"  (-ed, adjective exists)  -> adjective shown, verb sense hidden
   - "exciting" (-ing, adjective exists) -> adjective ONLY (gerund noun + verb
     hidden), with a small "also the -ing form of excite" note
   - "listening" (-ing, pure gerund)     -> redirected to the verb "listen",
     like Longman
   - "eating"   (no adjective, no clean base found) -> shown as-is
   - ING_NOUN_KEEP words ("meeting")     -> shown as the noun, no redirect */
async function refineDictResult(){
  dictRedirect = null; dictAlsoVerb = null;
  if(!dictResult || !dictResult.length) return;
  var q = (dictQuery||'').trim().toLowerCase();
  var isIng = /ing$/.test(q), isEd = /ed$/.test(q);
  if(!isIng && !isEd) return;
  var hasAdj = dictResult.some(function(en){
    return (en.meanings||[]).some(function(m){ return (m.partOfSpeech||'').toLowerCase()==='adjective'; });
  });
  if(isIng && ING_NOUN_KEEP.indexOf(q) !== -1){
    /* real noun like "meeting": keep noun (and adjective), hide the bare participle verb line */
    var hasOther = dictResult.some(function(en){
      return (en.meanings||[]).some(function(m){ return (m.partOfSpeech||'').toLowerCase()!=='verb'; });
    });
    if(hasOther) filterMeanings(function(m){ return (m.partOfSpeech||'').toLowerCase()!=='verb'; });
    return;
  }
  if(hasAdj){
    var base = isIng ? extractBaseVerb() : null;
    filterMeanings(function(m){
      var p = (m.partOfSpeech||'').toLowerCase();
      if(p==='verb') return false;
      if(isIng && p==='noun') return false; /* the -ing noun is just the gerund */
      return true;
    });
    if(isIng){
      if(!base){
        var cands = ingBaseCandidates(q);
        if(cands.length) base = cands[0];
      }
      dictAlsoVerb = base || null;
    }
    return;
  }
  if(!isIng) return;
  /* No adjective: this -ing word is probably a pure gerund (listening).
     Try to find the base verb and show that entry instead. */
  var candidates = [];
  var fromDef = extractBaseVerb();
  if(fromDef) candidates.push(fromDef);
  ingBaseCandidates(q).forEach(function(c){ if(candidates.indexOf(c)===-1) candidates.push(c); });
  for(var i=0;i<candidates.length;i++){
    var data = await fetchEntryWithVerb(candidates[i]);
    if(data){

      return;
    }
  }

/* ---- real-usage part-of-speech data (Datamuse, corpus-based) ----
   Longman-style behavior: "happy" is only ever used as an adjective in
   real English, so the rare noun/verb senses from Wiktionary are removed.
   When a word is genuinely both (need, fine, fire), the MORE COMMON part
   of speech is shown first. */
async function fetchWordMeta(w){
  try{
    var r = await fetch('https://api.datamuse.com/words?sp='+encodeURIComponent(w)+'&md=pf&max=1');
    if(!r.ok) return null;
    var arr = await r.json();
    if(!Array.isArray(arr) || !arr.length) return null;
    var item = arr[0];
    if(String(item.word||'').toLowerCase() !== w.toLowerCase()) return null;
    var posOrder = [], freq = null;
    (item.tags||[]).forEach(function(t){
      if(t==='n' && posOrder.indexOf('noun')===-1) posOrder.push('noun');
      else if(t==='v' && posOrder.indexOf('verb')===-1) posOrder.push('verb');
      else if(t==='adj' && posOrder.indexOf('adjective')===-1) posOrder.push('adjective');
      else if(t==='adv' && posOrder.indexOf('adverb')===-1) posOrder.push('adverb');
      else if(t.indexOf('f:')===0) freq = parseFloat(t.slice(2));
    });
    return { posOrder: posOrder, freq: isNaN(freq) ? null : freq };
  }catch(e){ return null; }
}
async function applyWordMeta(){
  dictMeta = null;
  if(!dictResult || !dictResult[0]) return;
  var w = String(dictResult[0].word || dictQuery || '').trim().toLowerCase();
  if(!w) return;
  var meta = await fetchWordMeta(w);
  if(!meta) return;
  dictMeta = meta;
  /* Drop parts of speech that real usage doesn't support — but only for
     words common enough that the corpus data is trustworthy, and never
     for POS types Datamuse can't tag (prepositions, interjections…). */
  var TAGGABLE = ['noun','verb','adjective','adverb'];
  if(meta.posOrder.length && meta.freq !== null && meta.freq >= 0.3){
    var somethingSurvives = false;
    dictResult.forEach(function(en){ (en.meanings||[]).forEach(function(m){
      var p = (m.partOfSpeech||'').toLowerCase();
      if(TAGGABLE.indexOf(p)===-1 || meta.posOrder.indexOf(p)!==-1) somethingSurvives = true;
    }); });
    if(somethingSurvives){
      filterMeanings(function(m){
        var p = (m.partOfSpeech||'').toLowerCase();
        return TAGGABLE.indexOf(p)===-1 || meta.posOrder.indexOf(p)!==-1;
      });
    }
  }
}
/* ---- make the entry learner-friendly ----
   Wiktionary definitions can be far above B1 ("having a feeling arising
   from a consciousness of well-being…"). After the entry is shown, every
   displayed definition is quietly rewritten in simple B1 English, and any
   definition without an example sentence gets one. Real example sentences
   that already exist are kept. */
async function ensureExamples(){
  if(dictAttribution==='ai') return false; /* AI definitions are already B1-simple with examples */
  if(!dictResult || !dictResult[0]) return false;
  var w = String(dictResult[0].word || dictQuery || '').trim();
  var items = [];
  dictPosGroups().forEach(function(g){
    g.defs.slice(0,4).forEach(function(d){
      if(d.definition) items.push({d:d, pos:g.pos});
    });
  });
  if(!items.length) return false;
  items = items.slice(0,10);
  var lines = items.map(function(it,i){
    return (i+1)+'. ('+(it.pos||'')+') '+it.d.definition;
  }).join('\n');
  var response = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:1500,
      messages:[{role:'user', content:
        'You simplify dictionary definitions for B1 (intermediate) English learners.\n' +
        'Word: "'+w.replace(/"/g,'')+'"\n' +
        'For each numbered definition below:\n' +
        'a) Rewrite it in simple, clear English that a B1 learner understands. Max 18 words. Keep the meaning accurate. Use everyday vocabulary only.\n' +
        'b) Write ONE natural example sentence using the word with that meaning. Max 14 words, simple B1 vocabulary.\n' +
        'DEFINITIONS:\n' + lines + '\n' +
        'Reply ONLY with minified JSON, no markdown fences, no other text: {"items":[{"d":"simple definition","e":"example sentence"},...]} in the same order as the numbered list.'
      }]
    })
  });
  if(!response.ok) return false;
  var data = await response.json();
  var text = (data.content||[]).filter(function(c){ return c.type==='text'; }).map(function(c){ return c.text; }).join('');
  var parsed = JSON.parse(text.replace(/```json|```/g,'').trim());
  var out = parsed.items || [];
  var changed = false;
  items.forEach(function(it,i){
    var o = out[i];
    if(!o) return;
    if(o.d && String(o.d).trim()){
      it.d.origDefinition = it.d.definition;   /* original kept, in case a teacher needs it */
      it.d.definition = String(o.d).trim();
      changed = true;
    }
    if(!it.d.example && o.e && String(o.e).trim()){
      it.d.example = String(o.e).trim();
      changed = true;
    }
  });
  if(changed) dictSimplified = true;
  return changed;
}

async function wiktionaryLookup(w){

  const data = await r.json();
  const sections = data.en;
  if(!sections || !sections.length) return null;
  const meanings = [];
  sections.slice(0,5).forEach(function(sec){
    const defs = (sec.definitions||[]).map(function(d){
      const text = stripHtml(d.definition);
      let example = '';
      if(d.parsedExamples && d.parsedExamples.length) example = stripHtml(d.parsedExamples[0].example);
      else if(d.examples && d.examples.length) example = stripHtml(d.examples[0]);
      return {definition:text, example:example};
    }).filter(function(d){ return d.definition; });
    if(defs.length) meanings.push({partOfSpeech:(sec.partOfSpeech||'').toLowerCase(), definitions:defs, synonyms:[]});
  });

function withSelection(fn){
  const el = activeRichEl;
  if(!el) return;
  el.focus();

  if(!sel || !sel.rangeCount) return;
  fn(sel, el);

function unwrapNode(m){
  const p = m.parentNode;
  if(!p) return;
  while(m.firstChild) p.insertBefore(m.firstChild, m);
  p.removeChild(m);
}
function applyHighlight(kind, color){
  const el = activeRichEl;
  if(!el) return;
  el.focus();
  restoreSelection();
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);

  /* nothing selected: remove the highlight the caret is sitting in, and step out of it */
  if(range.collapsed){
    let n = range.startContainer;
    while(n && n !== el && !(n.nodeType===1 && n.tagName==='MARK')) n = n.parentNode;
    if(n && n.nodeType===1 && n.tagName==='MARK'){
      if(kind === 'none'){ unwrapNode(n); }
      else{
        /* place the caret just after the mark so new typing is not highlighted */
        const after = document.createTextNode('\u200B');
        n.parentNode.insertBefore(after, n.nextSibling);
        const r = document.createRange();
        r.setStart(after, 1); r.collapse(true);
        sel.removeAllRanges(); sel.addRange(r);
      }
      rememberSelection();
      syncFromElement(el);
      scheduleSave();
    }
    return;
  }

  const frag = range.extractContents();
  const holder = document.createElement('div');
  holder.appendChild(frag);
  holder.querySelectorAll('mark').forEach(unwrapNode);

  let inserted = null;
  if(kind === 'none'){
    const out = document.createDocumentFragment();
    while(holder.firstChild) out.appendChild(holder.firstChild);
    range.insertNode(out);
  }else{
    const mark = document.createElement('mark');
    mark.className = 'hl' + (kind==='badge' ? ' hl-badge' : '');
    mark.style.backgroundColor = color;
    if(kind==='badge') mark.style.color = '#fff';
    while(holder.firstChild) mark.appendChild(holder.firstChild);
    range.insertNode(mark);
    inserted = mark;
  }
  /* leave the caret outside the highlight so typing continues normally */
  if(inserted && inserted.parentNode){
    const after = document.createTextNode('\u200B');
    inserted.parentNode.insertBefore(after, inserted.nextSibling);
    const r = document.createRange();
    r.setStart(after, 1); r.collapse(true);
    sel.removeAllRanges(); sel.addRange(r);
  }else{
    sel.removeAllRanges();
  }
  rememberSelection();
  syncFromElement(el);
  scheduleSave();
}
function applyTextColor(color){
  const el = activeRichEl;
  if(!el) return;
  el.focus();
  restoreSelection();
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  if(range.collapsed) return;
  const frag = range.extractContents();
  const holder = document.createElement('div');
  holder.appendChild(frag);
  holder.querySelectorAll('span.tcol, font').forEach(unwrapNode);
  let inserted = null;
  if(!color){
    const out = document.createDocumentFragment();
    while(holder.firstChild) out.appendChild(holder.firstChild);
    range.insertNode(out);
  }else{
    const span = document.createElement('span');
    span.className = 'tcol';
    span.style.color = color;
    while(holder.firstChild) span.appendChild(holder.firstChild);
    range.insertNode(span);
    inserted = span;
  }
  if(inserted && inserted.parentNode){
    const after = document.createTextNode('\u200B');
    inserted.parentNode.insertBefore(after, inserted.nextSibling);
    const r = document.createRange();
    r.setStart(after, 1); r.collapse(true);
    sel.removeAllRanges(); sel.addRange(r);
  }else{ sel.removeAllRanges(); }
  rememberSelection();
  syncFromElement(el);
  scheduleSave();
}

      const p = m.parentNode;

const _posterJpegCache = {};
function _applyPoster(v, uri){
  v.setAttribute('poster', uri);
  const root = v.closest('.plyr');
  if(root){
    const pos = root.querySelector('.plyr__poster');
    if(pos) pos.style.backgroundImage = 'url("'+uri+'")';
  }
}
function rasterizePoster(v){
  const label = v.getAttribute('data-plabel') || 'Class video';
  const portrait = v.getAttribute('data-orient')==='portrait';
  const key = (portrait?'P|':'L|')+label;
  if(_posterJpegCache[key]){ _applyPoster(v, _posterJpegCache[key]); return; }
  const img = new Image();
  img.onload = function(){
    try{
      const w = portrait?1440:2560, h = portrait?2560:1440;
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      const jpg = cv.toDataURL('image/jpeg', 0.86);
      _posterJpegCache[key] = jpg;
      _applyPoster(v, jpg);
    }catch(e){}
  };
  img.src = clipPosterURI(label, portrait);
}
function initClipPlayers(){
  document.querySelectorAll('video.js-player').forEach(function(v){
    if(typeof Plyr!=='undefined' && !v.closest('.plyr')){

          controls:['play-large','play','progress','current-time','duration','mute','volume','settings','fullscreen'],
          settings:['speed'],
          resetOnEnd:true
        });
      }catch(e){}
    }
    rasterizePoster(v);
  });
}

/* keep the course title on one line: shrink it just enough to fit the space beside the book */
function fitHeroTitle(){
  const el = document.querySelector('.hero-title');
  if(!el) return;
  const MAX = 34, MIN = 17;
  el.style.fontSize = MAX + 'px';
  const avail = el.clientWidth, need = el.scrollWidth;
  if(avail > 0 && need > avail){
    let fs = Math.max(MIN, Math.floor(MAX * avail / need * 10) / 10);
    el.style.fontSize = fs + 'px';
    /* letter-spacing doesn't scale perfectly, so nudge down until it truly fits */
    while(fs > MIN && el.scrollWidth > el.clientWidth){ fs -= 0.5; el.style.fontSize = fs + 'px'; }
  }
}

function constellationSVG(){
  /* a fixed spark cluster: nodes + connecting lines that draw themselves once */
  const pts = [[16,74],[38,40],[64,58],[88,26],[112,52],[140,30]];
  let paths = '', dots = '';
  for(let i=0;i<pts.length-1;i++){
    const a = pts[i], b = pts[i+1];
    const len = Math.round(Math.hypot(b[0]-a[0], b[1]-a[1]));
    paths += '<path d="M'+a[0]+' '+a[1]+' L'+b[0]+' '+b[1]+'" style="--len:'+len+';animation-delay:'+(0.35+i*0.13).toFixed(2)+'s"/>';
  }
  pts.forEach(function(p,i){
    const r = (i===1||i===4) ? 2.6 : 1.7;
    dots += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+r+'" style="animation-delay:'+(0.5+i*0.13).toFixed(2)+'s"/>';
  });
  return '<svg class="hero-constel" viewBox="0 0 300 150" preserveAspectRatio="xMaxYMin slice" aria-hidden="true">'+paths+dots+'</svg>';
}

function renderDictionary(){
  let html = '' +
    '<div class="eyebrow" style="margin-bottom:4px;">English–English</div>' +
    '<div class="big-title serif" style="margin-bottom:16px;">Dictionary</div>' +

      '<button class="dict-go" onclick="lookupFromInput()">Go</button>' +
    '</div>';
  if(dictRecent.length){
    html += '<div class="recent-chips">' + dictRecent.map(function(w){
      return '<button class="recent-chip" onclick="lookupWord(\''+escapeAttr(w)+'\')">'+escapeHtml(w)+'</button>';
    }).join('') + '</div>';
  }
  if(dictLoading){
    html += '<div class="empty-note">Looking up “'+escapeHtml(dictQuery)+'”…</div>';
  }
  if(dictError){
    html += '<div class="dict-card"><div style="font-size:14px;line-height:1.6;">'+escapeHtml(dictError)+'</div>' +
      (dictSuggestions.length ? ('<div class="eyebrow" style="margin:12px 0 8px;">Did you mean</div><div class="recent-chips" style="margin-bottom:2px;">' +
        dictSuggestions.map(function(s){ return '<button class="recent-chip" onclick="lookupWord(\''+escapeAttr(s)+'\')">'+escapeHtml(s)+'</button>'; }).join('') + '</div>') : '') +
    '</div>';
  }
  if(dictResult){
    const entry = dictResult[0];
    const phon = entry.phonetic || (entry.phonetics||[]).map(function(p){return p.text;}).filter(Boolean)[0] || '';
    const audioObj = (entry.phonetics||[]).filter(function(p){ return p.audio; })[0];
    html += '<div class="dict-card">' +
      (dictRedirect ? ('<div class="dict-redirect">\u201C'+escapeHtml(dictRedirect.from)+'\u201D is the <b>-ing form</b> of the verb <b>'+escapeHtml(dictRedirect.to)+'</b>:</div>') : '') +
      '<div class="dict-word-row">' +
        '<span class="dict-word">'+escapeHtml(entry.word)+'</span>' +
        (phon ? '<span class="dict-phon">'+escapeHtml(phon)+'</span>' : '') +
        (audioObj ? '<button class="dict-audio-btn" onclick="playAudio(\''+escapeAttr(audioObj.audio)+'\')" title="Pronounce">▶</button>' : '<button class="dict-audio-btn" onclick="speakWord(\''+escapeAttr(entry.word)+'\')" title="Pronounce">▶</button>') +
      '</div>';
    /* One section per part of speech, Longman-style. Each has its own
       "+ Card" so students can save exactly the meaning they need. */
    var posGroups = dictPosGroups();
    var multiPos = posGroups.length>1;
    posGroups.forEach(function(g, gIdx){
      var front = dictCardFront(g, multiPos);
      var cardBtn = cardFrontExists(front)
        ? '<span class="dict-card-saved">\u2713 In my cards</span>'
        : '<button class="dict-card-btn" onclick="addCardFromDictPos('+gIdx+')" title="Save this meaning to my flashcards">+ Card</button>';
      html += '<div class="dict-homograph'+(gIdx===0?' first':' dict-homograph-sep')+'">' +
        (multiPos ? ('<span class="dict-homograph-word">'+escapeHtml(entry.word)+'<sup class="dict-sup">'+(gIdx+1)+'</sup></span>') : '') +
        '<span class="pos-tag">'+escapeHtml(g.pos)+'</span>' +
        '<span style="flex:1;"></span>' + cardBtn +
      '</div>';
      g.defs.slice(0,4).forEach(function(d, di){
        html += '<div class="def-item"><span class="def-num">'+(di+1)+'</span>'+escapeHtml(d.definition||'') +
          (d.example ? '<span class="def-example">“'+escapeHtml(d.example)+'”</span>' : '') +
        '</div>';
      });
    });
    if(dictAlsoVerb){
      html += '<div class="dict-note">\u201C'+escapeHtml(entry.word)+'\u201D is also the -ing form of the verb <span class="dict-verb-link" onclick="lookupWord(\''+escapeAttr(dictAlsoVerb)+'\')">'+escapeHtml(dictAlsoVerb)+'</span>.</div>';
    }
    var syns = [];
    dictResult.forEach(function(en){ (en.meanings||[]).forEach(function(m){
      (m.synonyms||[]).forEach(function(s){ if(syns.indexOf(s)===-1) syns.push(s); });
      (m.definitions||[]).forEach(function(d){ (d.synonyms||[]).forEach(function(s){ if(syns.indexOf(s)===-1) syns.push(s); }); });
    }); });
    if(syns.length){
      html += '<div class="eyebrow" style="margin:14px 0 8px;">Similar words — tap to look up</div><div class="recent-chips" style="margin-bottom:2px;">' +
        syns.slice(0,8).map(function(s){ return '<button class="recent-chip" onclick="lookupWord(\''+escapeAttr(s)+'\')">'+escapeHtml(s)+'</button>'; }).join('') + '</div>';
    }
    if(dictSimplified){
      html += '<div class="dict-note">Definitions rewritten in simple English for B1 learners. If a meaning looks unusual, check with your teacher.</div>';
    }
    if(dictAttribution==='wiktionary'){
      html += '<div class="dict-note">Definition from <a href="https://en.wiktionary.org/wiki/'+escapeAttr(dictQuery.trim().toLowerCase().replace(/\s+/g,'_'))+'" target="_blank" style="color:var(--crimson);font-weight:600;">Wiktionary</a> (CC BY-SA).</div>';
    }else if(dictAttribution==='ai'){
      html += '<div class="dict-note">Smart definition written for B1 learners. If a meaning looks unusual, check with your teacher.</div>';
    }
    html += '</div>';
  }

  if(!dictQuery.trim() && !dictLoading && !dictResult && !dictError){
    html += '<div class="empty-note">Type any English word to see its meaning, examples and pronunciation.</div>';
  }
  return html;
}

function stripTags(html){
  if(!html) return '';
  const d = document.createElement('div');
  d.innerHTML = html;
  return (d.textContent||'').replace(/\s+/g,' ').trim();
}
function blockTypeLabel(t){
  return {heading:'Heading', text:'Text', callout:'Banner', quote:'Quote', timer:'Timer', reveal:'Answers', gallery:'Gallery', tabs:'Tabs', tabpage:'Tab', bulleted:'List', numbered:'List', tasklist:'Checklist', table:'Table', embed:'Video', audio:'Audio', clip:'Clip', image:'Image', quiz:'Quiz', toggle:'Toggle'}[t] || 'Content';
}
function blockSearchEntries(blocks, out, pageId){
  (blocks||[]).forEach(function(b){
    if(!b) return;
    let txt = '';
    if(b.type==='heading'||b.type==='text'||b.type==='callout') txt = stripTags(b.text);
    else if(b.type==='quote') txt = stripTags(b.text)+' '+stripTags(b.cite);
    else if(b.type==='bulleted'||b.type==='numbered') txt = (b.items||[]).map(stripTags).join(' \u2022 ');
    else if(b.type==='tasklist') txt = (b.items||[]).map(function(i){ return stripTags(i&&i.text); }).join(' \u2022 ');
    else if(b.type==='table') txt = (b.headers||[]).map(stripTags).join(' ')+' '+(b.rows||[]).map(function(r){ return (r||[]).map(stripTags).join(' '); }).join(' ');
    else if(b.type==='embed'||b.type==='audio'||b.type==='clip'||b.type==='image') txt = b.label||'';
    else if(b.type==='quiz'){
      const parts = [b.title||''];
      (b.questions||[]).forEach(function(qq){
        parts.push(qq.instr||'', qq.prompt||'', (qq.options||[]).join(' '), (qq.items||[]).join(' '), qq.explain||'');
      });
      txt = parts.join(' ');
    }else if(isContainer(b)){
      txt = b.title||'';
      blockSearchEntries(b.blocks, out, pageId);
    }
    txt = (txt||'').replace(/\*\*|__|==|[\[\]*]/g,'').replace(/\s+/g,' ').trim();
    if(txt) out.push({pageId:pageId, blockId:b.id, btype:b.type, text:txt});
  });
}
function searchSnippet(text, q){
  const lo = text.toLowerCase();
  const at = lo.indexOf(q);
  if(at<0) return escapeHtml(text.slice(0,80));
  const start = Math.max(0, at-32);
  const end = Math.min(text.length, at+q.length+48);
  return (start>0?'\u2026':'')+escapeHtml(text.slice(start,at))+
    '<mark class="hl">'+escapeHtml(text.slice(at,at+q.length))+'</mark>'+
    escapeHtml(text.slice(at+q.length,end))+(end<text.length?'\u2026':'');
}
function renderSearch(){
  const flat = [];
  (function walk(pages, trail){
    pages.forEach(function(p){
      flat.push({id:p.id, title:p.title, icon:p.icon, trail:trail, blocks:p.blocks});
      if(p.children && p.children.length) walk(p.children, trail.concat([p.title]));
    });
  })(state.pages, []);
  const q = searchQuery.trim().toLowerCase();
  const pageResults = q ? flat.filter(function(f){ return f.title.toLowerCase().indexOf(q)!==-1; }) : flat;
  let contentResults = [];
  if(q){
    flat.forEach(function(f){
      const entries = [];
      blockSearchEntries(f.blocks, entries, f.id);
      entries.forEach(function(e){
        if(e.text.toLowerCase().indexOf(q)!==-1) contentResults.push({page:f, entry:e});
      });
    });
    contentResults = contentResults.slice(0, 40);
  }
  let h = '' +
    '<button class="search-back" onclick="switchTab(\'home\')">\u2190 Back</button>' +
    '<div class="eyebrow" style="margin-bottom:4px;">Find anything</div>' +
    '<div class="big-title serif" style="margin-bottom:16px;">Search</div>' +
    '<div class="search-box"><span class="search-icon">'+iconHTML('search')+'</span>' +
    '<input class="search-input" type="text" placeholder="Search pages, lessons, quizzes\u2026" value="'+escapeAttr(searchQuery)+'" oninput="onSearchInput(this.value)"/></div>' +
    '<div class="search-results">';
  if(pageResults.length){
    if(q) h += '<div class="section-label">Pages</div>';
    h += pageResults.map(function(r,i){
      return '<div class="search-row" style="--d:'+(i*0.035).toFixed(3)+'s" onclick="openFromSearch(\''+r.id+'\')">' +
        '<span class="icon-chip small">'+iconHTML(r.icon)+'</span>' +
        '<div><div class="search-title">'+escapeHtml(r.title)+'</div>' +
        '<div class="search-path">'+(escapeHtml(r.trail.join(' \u203a '))||'Home')+'</div></div></div>';
    }).join('');
  }
  if(contentResults.length){
    h += '<div class="section-label">In page content</div>';
    h += contentResults.map(function(c,i){
      const p = c.page, e = c.entry;
      return '<div class="search-row" style="--d:'+(i*0.035).toFixed(3)+'s" onclick="openFromSearchBlock(\''+p.id+'\',\''+e.blockId+'\')">' +
        '<span class="icon-chip small">'+iconHTML(p.icon)+'</span>' +
        '<div style="min-width:0;"><div class="search-title">'+escapeHtml(p.title)+'<span class="search-badge">'+blockTypeLabel(e.btype)+'</span></div>' +
        '<div class="search-snip">'+searchSnippet(e.text, q)+'</div></div></div>';
    }).join('');
  }
  if(!pageResults.length && !contentResults.length){
    h += '<div class="empty-note">Nothing matches \u201c'+escapeHtml(searchQuery)+'\u201d \u2014 try a different word.</div>';
  }
  h += '</div>';
  return h;
}
function openAncestorToggles(blocks, targetId){
  const arr = blocks||[];
  for(let i=0;i<arr.length;i++){
    const b = arr[i];
    if(!b) continue;
    if(b.id===targetId) return true;
    if(b.blocks && b.blocks.length && openAncestorToggles(b.blocks, targetId)){
      if(b.type==='toggle' || b.type==='reveal') b.open = true;
      return true;
    }
  }
  return false;
}

function renderBlocks(blocks, containerId){

function renderBlock(b, arr, i, containerId){
  const controls = editMode ? (
    '<div class="block-controls">' +
      (i>0 ? '<button onclick="moveBlock(\''+b.id+'\',-1)" title="Move up">↑</button>' : '') +
      (i<arr.length-1 ? '<button onclick="moveBlock(\''+b.id+'\',1)" title="Move down">↓</button>' : '') +
      (containerId!=='ROOT' ? '<button onclick="releaseFromToggle(\''+b.id+'\')" title="Move out of toggle, onto the page">⇤</button>' : '') +
      '<button onclick="duplicateBlock(\''+b.id+'\')" title="Duplicate">⧉</button>' +

      '<button onclick="saveBlockTemplate(\''+b.id+'\')" title="Save as a reusable block">\u2B50</button>' +
      '<button onclick="startMoveBlock(\''+b.id+'\')" title="Move to another spot on the page">≡</button>' +
      '<button onclick="deleteBlock(\''+b.id+'\')" title="Delete">✕</button>' +

  ) : '';

function taskListHTML(b){
  const items = b.items || [];
  const done = items.filter(function(i,ix){ return isTaskDone(b.id, ix, i && i.done); }).length;
  const pct = items.length ? Math.round((done/items.length)*100) : 0;
  const bar = items.length > 1
    ? '<div class="task-prog"><div class="task-prog-bar"><span style="width:'+pct+'%"></span></div>' +

function toggleTaskItem(id, idx){
  const node = findBlockNode(currentPage().blocks, id);
  if(!node || !node.items || !node.items[idx]) return;
  const now = !isTaskDone(id, idx, node.items[idx].done);
  setTaskDone(id, idx, now);
  const host = document.querySelector('[data-bid="'+id+'"] .b-tasklist');
  if(!host){ render(); quietSave(); return; }
  const row = host.querySelectorAll('.task-row')[idx];
  if(row){
    row.classList.toggle('done', now);
    const box = row.querySelector('.task-check');
    if(box) box.setAttribute('aria-checked', now ? 'true' : 'false');
  }
  const items = node.items;
  const done = items.filter(function(i,ix){ return isTaskDone(id, ix, i && i.done); }).length;
  const fill = host.querySelector('.task-prog-bar > span');
  const txt = host.querySelector('.task-prog-txt');
  if(fill) fill.style.width = (items.length ? Math.round((done/items.length)*100) : 0) + '%';
  if(txt) txt.textContent = done + '/' + items.length;
  /* ticks live on this device, so there is nothing to send to the database */
}
function addTaskItem(id){
  const node = findBlockNode(currentPage().blocks, id);
  if(node){ node.items.push({text:'New task', done:false}); persist(); render(); }

function deleteTaskItem(id, idx){
  const node = findBlockNode(currentPage().blocks, id);
  if(node){ node.items.splice(idx,1); if(!node.items.length) node.items.push({text:'Task to do',done:false}); persist(); render(); }
}

function romanNum(n){
  const R=[[1000,'m'],[900,'cm'],[500,'d'],[400,'cd'],[100,'c'],[90,'xc'],[50,'l'],[40,'xl'],[10,'x'],[9,'ix'],[5,'v'],[4,'iv'],[1,'i']];
  let s=''; R.forEach(function(p){ while(n>=p[0]){ s+=p[1]; n-=p[0]; } });
  return s;
}

  if(style==='num') return String(i+1);

function countGaps(raw){
  const re = /\[([^\]]*)\]/g; let n=0;
  while(re.exec(raw)) n++;
  return n;
}
function nl2br(s){ return escapeHtml(s).replace(/\n/g,'<br>'); }
function fmtInline(s){
  // escape first, then convert **bold** and *italic* (and __/_ ) markers, then newlines
  let out = escapeHtml(s);
  out = out.replace(/==(yellow|green|blue|pink|purple|orange|red|mint):([^=\n]+)==/g, '<mark class="hl hl-$1">$2</mark>');
  out = out.replace(/==([^=\n]+)==/g, '<mark class="hl hl-yellow">$1</mark>');
  out = out.replace(/\*\*\*([^*]+)\*\*\*/g, '<b class="heavy">$1</b>');
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  out = out.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  out = out.replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>');
  out = out.replace(/\n/g,'<br>');
  return out;
}

      if(s.charAt(0)==='*'){ correct = opts.length; s = s.slice(1).trim(); }
      if(s) opts.push(s);
    });
    if(correct<0 && opts.length) correct = 0;
    dds.push({options:opts, correct:correct});
  }
  return dds;
}

function checkQuiz(id){
  const node = findBlockNode(currentPage().blocks, id);
  const root = document.querySelector('.b-quiz[data-quiz="'+id+'"]');
  if(!node || !root) return;
  let correctCount = 0, total = 0;
  node.questions.forEach(function(q){
    const qEl = root.querySelector('.quiz-q[data-qid="'+q.qid+'"]');
    if(!qEl) return;
    qEl.classList.add('answered');
    let ok = true;
    if(q.kind==='match'){
      const style = q.labelStyle||'alpha';
      const sels = qEl.querySelectorAll('.match-sel');
      sels.forEach(function(sel, i){
        const picked = parseInt(sel.value,10);
        const want = (q.answers||[])[i];
        const good = (want!=null && want>=0 && picked===want);
        sel.classList.toggle('match-right', good);
        sel.classList.toggle('match-wrong', !good);
        sel.disabled = true;
        total++;
        if(good){ correctCount++; }
        else{
          ok = false;
          const wrap = sel.parentNode;
          const ans = wrap && wrap.querySelector('.match-ans');
          if(ans && want!=null && want>=0){
            ans.textContent = matchLabel(style, want);
            ans.style.display = 'block';
          }
        }
      });
    }else if(q.kind==='dd'){
      const dds = ddOptionsFor(q.prompt||'');
      const sels = qEl.querySelectorAll('.dd-sel');
      sels.forEach(function(sel, i){
        const picked = parseInt(sel.value,10);
        const want = (dds[i]||{}).correct;
        const good = (want!=null && want>=0 && picked===want);
        sel.classList.toggle('dd-right', good);
        sel.classList.toggle('dd-wrong', !good);
        sel.disabled = true;
        total++;
        if(good){ correctCount++; }
        else{
          ok = false;
          const wrap = sel.parentNode;
          const ans = wrap && wrap.querySelector('.dd-answer');
          if(ans && want!=null && want>=0){
            ans.textContent = (dds[i].options||[])[want] || '';
            ans.style.display = 'block';
          }
        }
      });
    }else if(q.kind==='gap'){
      const gaps = gapAnswersFor(q.prompt||'');
      const rawGaps = gapRawFor(q.prompt||'');
      const inputs = qEl.querySelectorAll('.quiz-gap');
      inputs.forEach(function(inp, i){
        const val = (inp.value||'').trim().toLowerCase();
        const accepted = gaps[i]||[];
        const good = accepted.indexOf(val)>=0;
        inp.classList.toggle('gap-right', good);
        inp.classList.toggle('gap-wrong', !good);
        inp.disabled = true;
        total++;
        if(good){ correctCount++; }
        else{
          ok = false;
          const wrap = inp.parentNode;
          const ans = wrap && wrap.querySelector('.quiz-gap-answer');
          if(ans){
            const first = (rawGaps[i]||[])[0] || '';
            ans.textContent = first;
            ans.style.display = 'inline';
          }
        }
      });
    }else{
      const correct = (q.correct||[]).slice().sort().join(',');
      const picked = [];
      qEl.querySelectorAll('.quiz-opt').forEach(function(o){
        const oi = parseInt(o.getAttribute('data-oi'),10);
        const isCorrect = (q.correct||[]).indexOf(oi)>=0;
        const isPicked = o.classList.contains('picked');
        if(isPicked) picked.push(oi);
        o.classList.toggle('opt-correct', isCorrect);
        if(isPicked && !isCorrect) o.classList.add('opt-wrong');
      });
      if(picked.slice().sort().join(',') !== correct) ok = false;
      total++;
      if(ok) correctCount++;
    }
    if(ok){ qEl.classList.add('q-right'); }
    else{ qEl.classList.add('q-wrong'); }
    const exp = qEl.querySelector('.quiz-explain-view');
    if(exp && !ok && (q.explain||'').trim()){
      exp.innerHTML = fmtInline(q.explain);
      exp.style.display = 'block';
    }
  });
  const score = root.querySelector('.quiz-score');
  if(score){ score.textContent = correctCount+' / '+total+' correct'; score.style.display='inline-block';
    score.className = 'quiz-score '+(correctCount===total?'all-right':'some-wrong'); }
  if(total > 0){
    recordQuizScore(id, correctCount, total);
    const hist = root.querySelector('.quiz-history-slot');
    if(hist) hist.innerHTML = quizHistoryHTML(id);
  }
  if(correctCount === total && total > 0) fireConfetti();
}

function htmlToLines(html){
  const host = document.createElement('div');
  host.innerHTML = html || '';
  const lines = [];
  let buf = '', started = false;
  function flush(){ lines.push(buf); buf=''; started=false; }
  Array.from(host.childNodes).forEach(function(n){
    if(n.nodeType===1 && (n.tagName==='DIV'||n.tagName==='P')){
      if(started) flush();
      lines.push(n.innerHTML);
    } else if(n.nodeType===1 && n.tagName==='BR'){
      flush();
    } else {
      buf += (n.nodeType===1 ? n.outerHTML : escapeHtml(n.textContent));
      started = true;
    }
  });
  if(started) flush();
  if(!lines.length) lines.push('');
  return lines;
}
function linesToHtml(lines){
  return lines.map(function(l){
    /* keep the indent on an empty line, otherwise a blank line inside a
       toggle would silently fall back out of it */
    const p = splitIndent(String(l==null?'':l));
    const empty = p.rest.replace(/<[^>]*>/g,'').trim() === '';
    const pad = new Array(p.depth+1).join('\u2003');
    return '<div>' + pad + (empty ? '<br>' : p.rest) + '</div>';
  }).join('');
}
/* ============================================================
   DIVIDERS — flat, delicate, and painted in the current accent
   ============================================================ */
const DIVIDERS = [
  ['hairline','Hairline'],['soft','Soft'],['accent','Accent'],['short','Short'],
  ['double','Double'],['dots','Dots'],['dashes','Dashes'],['caps','Caps'],
  ['diamond','Diamond'],['trio','Trio'],['star','Star'],['ring','Ring'],
  ['wave','Wave'],['zigzag','Zigzag'],['scallop','Scallop'],['leaf','Leaf']
];
const DIVIDER_IDS = DIVIDERS.map(function(d){ return d[0]; });
/* the shorthand people typed before v10 still works */
const DIVIDER_LEGACY = {'---':'hairline','___':'hairline','...':'dots','- - -':'dashes',
  '===':'accent','***':'star','+++':'trio','~~~':'wave'};
const ARROW_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';

function dividerHTML(style){
  const s = DIVIDER_IDS.indexOf(style) >= 0 ? style : 'hairline';
  const line = '<span class="dvx-line"></span>';
  let inner;
  if(s==='diamond')      inner = line+'<span class="dvx-orn"><span class="dvx-dia"></span></span>'+line;
  else if(s==='trio')    inner = line+'<span class="dvx-orn"><span class="dvx-dot"></span><span class="dvx-dot"></span><span class="dvx-dot"></span></span>'+line;
  else if(s==='star')    inner = line+'<span class="dvx-orn"><span class="dvx-glyph">\u2726</span></span>'+line;
  else if(s==='ring')    inner = line+'<span class="dvx-orn"><span class="dvx-ring"></span></span>'+line;
  else if(s==='leaf')    inner = line+'<span class="dvx-orn"><span class="dvx-glyph">\u2767</span></span>'+line;
  else if(s==='caps')    inner = '<span class="dvx-cap"></span>'+line+'<span class="dvx-cap"></span>';
  else if(s==='dots'||s==='dashes'||s==='wave'||s==='zigzag'||s==='scallop')
                         inner = '<span class="dvx-mask"></span>';
  else                   inner = '<span class="dvx-bar"></span>';
  return '<div class="dvx dvx-'+s+'">'+inner+'</div>';
}

/* ============================================================
   BANNERS — strong and soft, eight hues, in the ClickUp manner
   ============================================================ */
const BANNER_HUES = [
  ['red','Red'],['orange','Orange'],['yellow','Yellow'],['green','Green'],
  ['blue','Blue'],['purple','Purple'],['pink','Pink'],['grey','Grey']
];
const BANNER_LETTER = {r:'red',o:'orange',y:'yellow',g:'green',b:'blue',p:'purple',k:'pink',e:'grey'};
const BANNER_CODE   = {red:'r',orange:'o',yellow:'y',green:'g',blue:'b',purple:'p',pink:'k',grey:'e'};
/* callout blocks written before v10 carried these class names */
const BANNER_LEGACY = {'co-white':'bn-plain','co-gray':'bn-t-grey','co-yellow':'bn-t-yellow',
  'co-red':'bn-t-red','co-green':'bn-t-green','co-blue':'bn-t-blue','co-purple':'bn-t-purple'};
function bannerClass(v){
  if(!v) return 'bn-t-yellow';
  if(BANNER_LEGACY[v]) return BANNER_LEGACY[v];
  return v;
}
function bannerMark(variant, hue){
  if(variant==='plain') return '\u2726n ';
  return '\u2726' + variant + (BANNER_CODE[hue]||'y') + ' ';
}
function bannerClassFromMark(code){
  if(!code) return 'bn-t-yellow';
  if(code==='n') return 'bn-plain';
  const v = code.charAt(0), h = BANNER_LETTER[code.charAt(1)] || 'yellow';
  return 'bn-' + (v==='s' ? 's' : 't') + '-' + h;
}

/* ============================================================
   TEXT-BLOCK LINES
   Each line is parsed once, then the flat list is folded into a
   tree so a toggle really owns the lines indented beneath it —
   including other toggles.
   ============================================================ */
const TL_TAGS = '((?:<[^>]*>|\\s|&nbsp;)*)';
const IND_CH = '\u2003';           /* one em space per indent level */
function tlRe(mid){ return new RegExp('^'+TL_TAGS+mid+'([\\s\\S]*)$'); }

function parseTextLine(raw){
  let l = String(raw==null?'':raw);
  const rawBare = l.replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ');
  const im = rawBare.match(/^\u2003+/);
  const indent = im ? im[0].length : 0;
  if(indent) l = l.split(IND_CH).join('');
  const bare = l.replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').trim();
  let m;

  const dm = bare.match(/^---([a-z]{3,9})$/);
  if(dm && DIVIDER_IDS.indexOf(dm[1])>=0)
    return {indent:indent, kind:'rule', html:'<div class="tl tl-rule">'+dividerHTML(dm[1])+'</div>'};
  if(DIVIDER_LEGACY[bare])
    return {indent:indent, kind:'rule', html:'<div class="tl tl-rule">'+dividerHTML(DIVIDER_LEGACY[bare])+'</div>'};

  if(m = l.match(tlRe('\u25B8###\\s+'))) return {indent:indent, kind:'toggle', level:'h3', body:m[1]+m[2]};
  if(m = l.match(tlRe('\u25B8##\\s+')))  return {indent:indent, kind:'toggle', level:'h2', body:m[1]+m[2]};
  if(m = l.match(tlRe('\u25B8#\\s+')))   return {indent:indent, kind:'toggle', level:'h1', body:m[1]+m[2]};
  if(m = l.match(tlRe('\u25B8\\s+')))    return {indent:indent, kind:'toggle', level:'text', body:m[1]+m[2]};

  if(m = l.match(tlRe('###\\s+'))) return {indent:indent, kind:'line', html:'<div class="tl tl-h3">'+m[1]+m[2]+'</div>'};
  if(m = l.match(tlRe('##\\s+')))  return {indent:indent, kind:'line', html:'<div class="tl tl-h2">'+m[1]+m[2]+'</div>'};
  if(m = l.match(tlRe('#\\s+')))   return {indent:indent, kind:'line', html:'<div class="tl tl-h1">'+m[1]+m[2]+'</div>'};
  if(m = l.match(tlRe('\\[\\]\\s+'))) return {indent:indent, kind:'line', html:'<div class="tl tl-task" onclick="toggleTask(this)"><span class="tl-check" role="checkbox" aria-checked="false"></span><span class="tl-body tl-task-body">'+m[1]+m[2]+'</span></div>'};
  if(m = l.match(tlRe('\u00BB\\s+'))) return {indent:indent, kind:'line', html:'<div class="tl tl-quote">'+m[1]+m[2]+'</div>'};
  if(m = l.match(tlRe('\u2726([st][royglbpke]|n)?\\s+')))
    return {indent:indent, kind:'line', html:'<div class="tl bnr tl-banner no-ico '+bannerClassFromMark(m[2])+'"><span class="bnr-body">'+m[1]+m[3]+'</span></div>'};
  if(m = l.match(tlRe('~\\s+')))  return {indent:indent, kind:'line', html:'<div class="tl tl-li"><span class="tl-dia">\u25C6</span><span class="tl-body">'+m[1]+m[2]+'</span></div>'};
  if(m = l.match(tlRe('-\\s+')))  return {indent:indent, kind:'line', html:'<div class="tl tl-li"><span class="tl-dash">\u2013</span><span class="tl-body">'+m[1]+m[2]+'</span></div>'};
  if(m = l.match(tlRe('[*\u2022]\\s+'))) return {indent:indent, kind:'line', html:'<div class="tl tl-li"><span class="tl-dot">\u2022</span><span class="tl-body">'+m[1]+m[2]+'</span></div>'};
  if(m = l.match(tlRe('(\\d{1,3})[.)]\\s+'))) return {indent:indent, kind:'line', html:'<div class="tl tl-li"><span class="tl-num">'+m[2]+'.</span><span class="tl-body">'+m[1]+m[3]+'</span></div>'};

  const stripped = l.replace(/<br\s*\/?>/gi,'').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').trim();
  if(stripped==='') return {indent:indent, kind:'blank', html:'<div class="tl tl-blank"></div>'};
  return {indent:indent, kind:'line', html:'<div class="tl">'+l+'</div>'};
}

function indentWrap(html, steps){

  return '<div class="tl-ind" style="margin-left:'+(steps*20)+'px">'+html+'</div>';
}
function renderTextLines(html, blockId){
  const items = htmlToLines(html).map(parseTextLine);
  if(blockId){
    let ti = 0;
    items.forEach(function(it){
      if(it.kind === 'line' && it.html.indexOf('tl-task') >= 0){
        const idx = ti++;
        const on = isTaskDone(blockId, 'i'+idx, false);
        it.html = it.html
          .replace('class="tl tl-task"', 'class="tl tl-task'+(on?' done':'')+'"')
          .replace('onclick="toggleTask(this)"', 'onclick="toggleTask(this,\''+blockId+'\','+idx+')"')
          .replace('aria-checked="false"', 'aria-checked="'+(on?'true':'false')+'"');
      }
    });
  }
  let i = 0;
  function walk(base){
    let out = '';
    while(i < items.length){

        out += indentWrap('<div class="tl-tg lv-'+it.level+'">' + toggleHeadHTML(it) +
          '<div class="tl-tgbody">' + (inner || '<div class="tl tl-blank tl-tg-empty">Empty \u2014 indent a line to put it in here.</div>') +
          '</div></div>', own - base);

function timerPaint(id){
  const host = document.querySelector('[data-tid="'+id+'"]');
  const t = timerRT[id];
  if(!host || !t) return;
  const face = host.querySelector('.tm-face');
  if(face) face.textContent = timerFace(t.left);
  const fill = host.querySelector('.tm-fill');
  if(fill){
    const C = 2*Math.PI*34;
    fill.style.strokeDashoffset = ((1 - (t.total ? t.left/t.total : 0)) * C).toFixed(1);
  }
  const btn = host.querySelector('.tm-btn.primary');
  if(btn) btn.textContent = t.running ? 'Pause' : 'Start';
  host.classList.toggle('running', !!t.running);
  host.classList.toggle('done', t.left <= 0);
}
function timerToggle(id){
  const t = timerRT[id];
  if(!t) return;
  if(t.left <= 0){ t.left = t.total; }
  t.running = !t.running;
  t.at = Date.now();
  timerPaint(id);
}
function timerReset(id){
  const t = timerRT[id];
  if(!t) return;
  t.left = t.total; t.running = false;
  timerPaint(id);
}
function timerChime(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    [0, 0.18, 0.36].forEach(function(d){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + d);
      g.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + d + 0.16);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 0.2);
    });
    setTimeout(function(){ try{ ctx.close(); }catch(e){} }, 1200);
  }catch(e){}
}
setInterval(function(){
  Object.keys(timerRT).forEach(function(id){
    const t = timerRT[id];
    if(!t.running) return;
    const now = Date.now();
    t.left -= (now - (t.at||now)) / 1000;
    t.at = now;
    if(t.left <= 0){ t.left = 0; t.running = false; timerChime(); }
    timerPaint(id);
  });
}, 250);

  if(moveChoosingPage) return renderMovePagePicker();
  const sourcePage = currentPage();
  const moving = findBlockNode(sourcePage.blocks, moveBlockId);
  if(!moving) return '';
  const destPage = getMoveTargetPage();
  const isSamePage = destPage.id === sourcePage.id;
  const excludeIds = [];
  collectSubtreeIds(moving, excludeIds);
  const flat = [];
  flattenBlocksForMove(destPage.blocks, 0, flat, excludeIds);
  return '<div class="modal-overlay" onclick="if(event.target===this)cancelMoveBlock()">' +
    '<div class="modal modal-lg"><h3>Move block</h3>' +
    '<div class="hint">Moving: '+escapeHtml(blockPreviewLabel(moving))+'</div>' +
    '<div class="move-page-row"><span>To: <strong>'+escapeHtml(destPage.title)+'</strong>'+(isSamePage?' (this page)':'')+'</span><button class="chip-btn" onclick="openMovePagePicker()">Change page</button></div>' +
    '<div class="move-target-list">' +
      '<button class="move-target" onclick="confirmMoveTo(null)">↥ Move to the very top of '+(isSamePage?'this page':escapeHtml(destPage.title))+'</button>' +
      flat.map(function(item){
        return '<button class="move-target" style="padding-left:'+(14+item.depth*16)+'px" onclick="confirmMoveTo(\''+item.id+'\')">↳ After: '+escapeHtml(item.label)+'</button>';
      }).join('') +
    '</div>' +
    '<div class="modal-actions"><span></span><span class="right-group"><button class="btn" onclick="cancelMoveBlock()">Cancel</button></span></div>' +
    '</div></div>';
}
function renderMovePagePicker(){
  const flat = [];
  flattenAllPages(state.pages, [], flat);
  const curId = currentPage().id;
  return '<div class="modal-overlay" onclick="if(event.target===this)cancelMoveBlock()">' +
    '<div class="modal modal-lg"><h3>Move to which page?</h3>' +
    '<div class="move-target-list">' +
      flat.map(function(p){
        const path = p.trail.length ? (p.trail.join(' › ')+' › '+p.title) : p.title;
        return '<button class="move-target" onclick="pickMoveTargetPage(\''+p.id+'\')">'+(p.id===curId?'📍 ':'📄 ')+escapeHtml(path)+(p.id===curId?' (current page)':'')+'</button>';
      }).join('') +
    '</div>' +
    '<div class="modal-actions"><span></span><span class="right-group"><button class="btn" onclick="cancelMoveBlock()">Cancel</button></span></div>' +
    '</div></div>';
}
function renderCustomizeModal(){
  const isUnit = customizeDraft.section==='units';
  let html = '<div class="modal-overlay" onclick="if(event.target===this)closeCustomize()">' +
    '<div class="modal modal-lg"><h3>Edit page</h3>' +
    '<div class="eyebrow" style="margin-bottom:6px;">Title</div>' +
    '<input type="text" value="'+escapeAttr(customizeDraft.title)+'" oninput="onCustomizeTitleInput(this.value)"/>' +
    (isUnit ? '<div class="hint">Tip: keep the format “Unit 4 — Name” so the unit number badge shows correctly on the homepage.</div>' : '') +
    '<div class="eyebrow" style="margin-bottom:6px;">Icon</div>' +
    '<div class="emoji-grid">'+ICON_LIST.map(function(it){ return '<button title="'+it.label+'" class="'+(it.id===customizeDraft.icon?'picked':'')+'" onclick="setCustomizeIcon(\''+it.id+'\')">'+iconHTML(it.id)+'</button>'; }).join('')+'</div>';
  if(customizeDraft.isTopLevel){
    html += '<div class="eyebrow" style="margin-bottom:6px;">Show under</div>' +
      '<div class="seg-row mb">' +
        '<button class="seg-btn '+(customizeDraft.section!=='units'?'picked':'')+'" onclick="setCustomizeSection(\'general\')">Course</button>' +
        '<button class="seg-btn '+(customizeDraft.section==='units'?'picked':'')+'" onclick="setCustomizeSection(\'units\')">Units</button>' +
      '</div>' +
      '<div class="hint">Moving a page places it at the bottom of its new section. Units always stay in number order.</div>';
  }
  html += '<div class="eyebrow" style="margin-bottom:6px;">Colour</div>' +
    '<div class="color-grid">' +
      GRADIENTS.map(function(g){ return '<button class="color-swatch '+g+' '+(customizeDraft.colorFamily===g?'picked':'')+'" onclick="setCustomizeColor(\''+g+'\')"></button>'; }).join('') +
      '<button class="color-swatch auto-swatch '+(!customizeDraft.colorFamily?'picked':'')+'" onclick="setCustomizeColor(\'auto\')">Auto</button>' +
    '</div>' +
    '<div class="eyebrow" style="margin-bottom:6px;">Cover image (optional)</div>' +
    '<input type="text" placeholder="Paste an image link (e.g. Google Drive)…" value="'+escapeAttr(customizeDraft.cover||'')+'" oninput="onCustomizeCoverInput(this.value)"/>' +
    '<div class="modal-actions">' +
      '<button class="btn danger-ghost" onclick="deleteFromCustomize()">Delete page</button>' +
      '<span class="right-group"><button class="btn" onclick="closeCustomize()">Cancel</button><button class="btn primary" onclick="saveCustomize()">Save</button></span>' +
    '</div>' +
    '</div></div>';
  return html;
}
