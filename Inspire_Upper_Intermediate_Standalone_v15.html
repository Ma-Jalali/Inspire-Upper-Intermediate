  @media (min-width:561px){ #app{ box-shadow:0 0 80px rgba(30,22,10,0.20);} }
  .app-scroll{padding:18px 16px 24px;animation:screenEnter .32s cubic-bezier(.22,.9,.3,1);}
  @keyframes screenEnter{ from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
  /* staggered entrance: first blocks of a page cascade in */
  .app-scroll > *{animation:blockIn .5s cubic-bezier(.22,.9,.3,1) both;}
  .app-scroll > *:nth-child(1){animation-delay:.02s;}

  /* gold shimmer sweep across the hero plaque, once on load */

  .hero-card .aur.a1{width:230px;height:230px;top:-88px;right:-58px;background:radial-gradient(circle,#7C4DFF 0%,rgba(124,77,255,0) 70%);animation:auroraA 15s ease-in-out infinite;}

  .b-tasklist{display:flex;flex-direction:column;gap:2px;}
  .task-prog{display:flex;align-items:center;gap:9px;margin:0 0 8px;}
  .task-prog-bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden;}
  .task-prog-bar span{display:block;height:100%;border-radius:99px;
    background:linear-gradient(90deg,var(--crimson),var(--gold-bright));transition:width .45s var(--spring);}
  .task-prog-txt{font-family:var(--font-head);font-size:11.5px;font-weight:700;color:var(--ink-soft);
    font-variant-numeric:tabular-nums;flex-shrink:0;}
  .task-row{display:flex;align-items:flex-start;gap:10px;padding:2px 0;}
  .task-check{flex-shrink:0;width:21px;height:21px;margin-top:1px;border-radius:7px;border:2px solid var(--gold);background:var(--surface);box-shadow:inset 0 1px 2px rgba(var(--gold-rgb),0.12);position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s var(--spring),border-color .2s,transform .12s var(--spring);}
  .task-check:active{transform:scale(.9);}
  .task-check::after{content:'';display:block;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1.5px) rotate(45deg) scale(0);transform-origin:center;transition:transform .18s var(--spring);}
  .task-row.done .task-check{background:var(--g-crimson);border-color:var(--crimson-dark);box-shadow:inset 0 1px 0 rgba(255,255,255,0.3);}
  .task-row.done .task-check::after{transform:translateY(-1.5px) rotate(45deg) scale(1);}
  .task-text{flex:1;font-family:var(--font-read);font-size:15px;line-height:1.7;color:var(--ink-read);}
  .task-row.done .task-text{text-decoration:line-through;text-decoration-color:var(--crimson);text-decoration-thickness:2px;color:var(--ink-soft);}
  /* quiz block */
  .b-quiz{background:var(--surface);border:var(--edge);border-radius:var(--radius-md);padding:16px 16px 14px;box-shadow:var(--lift),var(--shadow);position:relative;overflow:hidden;}
  .b-quiz::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--g-crimson);}
  .quiz-title-row{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
  .quiz-badge{font-family:var(--font-head);font-size:10px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--g-crimson);padding:3px 9px;border-radius:7px;box-shadow:0 2px 6px -1px rgba(20,28,48,0.20);}
  .quiz-title,.quiz-title-view{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--ink);outline:none;}
  .quiz-q,.quiz-q-edit{padding:12px 0;border-top:1px solid var(--line);}
  .quiz-qnum{display:inline-flex;align-items:center;justify-content:center;min-width:21px;height:21px;padding:0 5px;border-radius:6px;background:var(--g-gold);color:#3A2E12;font-family:var(--font-head);font-weight:800;font-size:12px;margin-right:8px;box-shadow:0 1px 3px rgba(var(--gold-rgb),0.3);}
  .quiz-prompt,.quiz-prompt-view{font-family:var(--font-read);font-size:15.5px;font-weight:500;line-height:1.6;color:var(--ink);margin-bottom:10px;outline:none;}
  .quiz-prompt{border:1px dashed var(--line);border-radius:10px;padding:8px 10px;}
  .quiz-hint{font-size:11.5px;color:var(--ink-soft);margin:4px 0 9px;line-height:1.5;}
  .quiz-instr-view{font-family:var(--font-read);font-size:15px;font-weight:600;font-style:italic;color:var(--gold);margin-bottom:8px;line-height:1.55;padding-left:11px;border-left:2.5px solid var(--gold-bright);}
  .quiz-instr-wrap{margin:2px 0 9px;}
  .quiz-instr-label{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
  .quiz-instr{border:1px dashed var(--line);border-radius:9px;padding:7px 10px;font-family:var(--font-read);font-size:13.5px;font-style:italic;color:var(--ink-read);outline:none;min-height:18px;}
  .quiz-opt{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;margin:7px 0;cursor:pointer;transition:border-color .15s,background .15s,transform .12s var(--spring);background:var(--surface);}
  .quiz-opt:active{transform:scale(.99);}
  @media(hover:hover){ .quiz-opt:hover{border-color:var(--gold-bright);} }
  .quiz-box{flex-shrink:0;width:20px;height:20px;border-radius:50%;border:2px solid var(--gold);position:relative;transition:all .15s var(--spring);}
  .quiz-box.multi{border-radius:6px;}
  .quiz-opt.picked{border-color:var(--crimson);background:rgba(var(--accent-rgb),0.05);}
  .quiz-opt.picked .quiz-box{border-color:var(--crimson);background:var(--g-crimson);box-shadow:inset 0 1px 0 rgba(255,255,255,0.25);}
  .quiz-opt.picked .quiz-box::after{content:'';position:absolute;inset:0;margin:auto;width:7px;height:7px;border-radius:50%;background:#fff;}
  .quiz-opt.picked .quiz-box.multi::after{width:5px;height:9px;border-radius:0;background:transparent;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);top:-1px;left:1px;right:auto;bottom:auto;margin:0;position:absolute;}
  .quiz-opt-label{flex:1;font-family:var(--font-read);font-size:14.5px;line-height:1.5;color:var(--ink-read);}
  .quiz-opt.opt-correct{border-color:#3E9B54;background:rgba(62,155,84,0.08);animation:optPop .42s var(--spring);}
  @keyframes optPop{0%{transform:scale(1);}35%{transform:scale(1.025);}100%{transform:scale(1);}}
  .quiz-opt.opt-correct .quiz-box{animation:boxPop .45s var(--spring) .05s both;}
  @keyframes boxPop{0%{transform:scale(.4) rotate(-25deg);}60%{transform:scale(1.18) rotate(4deg);}100%{transform:scale(1) rotate(0);}}
  .quiz-opt.opt-correct .quiz-box{border-color:#3E9B54;background:#3E9B54;}
  .quiz-opt.opt-correct .quiz-box::after{content:'\2713';color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;position:absolute;inset:0;background:transparent;width:auto;height:auto;border:none;transform:none;}
  .quiz-opt.opt-wrong{border-color:var(--crimson);background:rgba(var(--accent-rgb),0.07);animation:optShake .4s ease;}
  @keyframes optShake{0%,100%{transform:translateX(0);}20%{transform:translateX(-5px);}40%{transform:translateX(5px);}60%{transform:translateX(-3px);}80%{transform:translateX(2px);}}
  .quiz-opt.opt-wrong .quiz-box{border-color:var(--crimson);background:var(--crimson);}
  .quiz-opt.opt-wrong .quiz-box::after{content:'\2715';color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;position:absolute;inset:0;background:transparent;width:auto;height:auto;border:none;transform:none;}
  .quiz-q.answered .quiz-opt{cursor:default;}
  .quiz-gap-line{font-family:var(--font-read);font-size:15.5px;line-height:2.1;color:var(--ink);}
  .quiz-gap-wrap{display:inline-flex;flex-direction:column;vertical-align:top;}
  .quiz-gap{border:none;border-bottom:2px solid var(--gold);background:rgba(var(--gold-rgb),0.08);border-radius:6px 6px 0 0;padding:2px 8px;font-family:var(--font-read);font-size:15px;min-width:80px;width:110px;color:var(--ink);outline:none;transition:border-color .15s,background .15s;}
  .quiz-gap:focus{border-color:var(--crimson);background:rgba(var(--accent-rgb),0.05);}
  .quiz-gap.gap-right{border-color:#3E9B54;background:rgba(62,155,84,0.12);color:#2C7A40;font-weight:600;animation:gapGood .45s var(--spring);}
  @keyframes gapGood{0%{transform:scale(1);}40%{transform:scale(1.06);}100%{transform:scale(1);}}
  .quiz-gap.gap-wrong{border-color:var(--crimson);background:rgba(var(--accent-rgb),0.1);color:var(--crimson);font-weight:600;text-decoration:line-through;text-decoration-thickness:1.5px;animation:optShake .4s ease;}
  .quiz-gap-answer{display:none;font-family:var(--font-read);font-size:12.5px;font-weight:700;color:#2C7A40;padding:1px 8px 0;line-height:1.4;}
  .quiz-gap-answer::before{content:'\2713 ';font-weight:800;}
  .quiz-gap-answer,.dd-answer{animation:ansIn .35s ease both;}
  @keyframes ansIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
  /* dropdown-in-sentence question */
  .quiz-dd-line{font-family:var(--font-read);font-size:15.5px;line-height:2.4;color:var(--ink);}
  .quiz-dd-wrap{display:inline-flex;flex-direction:column;vertical-align:middle;margin:0 3px;}
  .dd-sel{appearance:none;-webkit-appearance:none;border:1.5px solid var(--gold);border-radius:11px;padding:6px 32px 6px 13px;font-family:var(--font-read);font-size:14.5px;font-weight:600;color:var(--ink);outline:none;cursor:pointer;background-color:var(--surface);box-shadow:var(--shadow-xs), inset 0 1px 0 rgba(255,255,255,0.35);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5 6 6.5 11 1.5' fill='none' stroke='%23A2823F' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 11px center;transition:border-color .15s, box-shadow .15s, background-color .15s, transform .12s var(--spring);}
  .dd-sel:active{transform:scale(.97);}
  .dd-sel:focus{border-color:var(--crimson);box-shadow:var(--focus-ring);}
  .dd-sel.dd-right{animation:gapGood .45s var(--spring);border-color:#3E9B54;background-color:rgba(62,155,84,0.12);color:#2C7A40;font-weight:700;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5 6 6.5 11 1.5' fill='none' stroke='%233E9B54' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");}
  .dd-sel.dd-wrong{animation:optShake .4s ease;border-color:var(--crimson);background-color:rgba(var(--accent-rgb),0.1);color:var(--crimson);font-weight:700;text-decoration:line-through;text-decoration-thickness:1.5px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5 6 6.5 11 1.5' fill='none' stroke='%23D61439' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");}
  .dd-answer{display:none;font-family:var(--font-read);font-size:12.5px;font-weight:700;color:#2C7A40;padding:2px 6px 0;line-height:1.4;text-align:center;}
  .dd-answer::before{content:'\2713 ';font-weight:800;}
  /* inline highlight (==text==) */
  /* highlighter — flat pastel, softly rounded */
  mark.hl{color:inherit;border-radius:5px;padding:1px 5px;margin:0 -1px;
    box-decoration-break:clone;-webkit-box-decoration-break:clone;
    background-image:linear-gradient(104deg, var(--h1) 0%, var(--h2) 46%, var(--h1) 100%);}
  mark.hl[style*="background"]{background-image:none;}
  mark.hl.hl-badge{border-radius:6px;padding:2px 7px;
    box-shadow:0 1px 3px rgba(16,22,44,0.22);}
  html[data-theme="dark"] mark.hl:not(.hl-badge){filter:brightness(.72) saturate(.85);}
  html[data-theme="dark"] mark.hl:not(.hl-badge),
  html[data-theme="dark"] mark.hl:not(.hl-badge) *{color:#0E1424;}
  mark.hl-yellow {--h1:rgba(255,224,110,.85);--h2:rgba(255,208,58,.62);--h3:rgba(214,158,0,.22);}
  mark.hl-green  {--h1:rgba(160,240,175,.85);--h2:rgba(104,222,132,.60);--h3:rgba(24,150,66,.22);}
  mark.hl-mint   {--h1:rgba(150,242,228,.85);--h2:rgba(88,224,205,.58);--h3:rgba(10,150,136,.22);}
  mark.hl-blue   {--h1:rgba(168,214,255,.88);--h2:rgba(108,178,252,.60);--h3:rgba(22,110,200,.22);}
  mark.hl-purple {--h1:rgba(214,190,255,.88);--h2:rgba(174,140,250,.60);--h3:rgba(104,58,208,.22);}
  mark.hl-pink   {--h1:rgba(255,190,224,.88);--h2:rgba(252,138,196,.58);--h3:rgba(206,50,134,.22);}
  mark.hl-orange {--h1:rgba(255,205,150,.88);--h2:rgba(255,168,84,.60);--h3:rgba(206,108,10,.22);}
  mark.hl-red    {--h1:rgba(255,184,180,.88);--h2:rgba(252,132,126,.58);--h3:rgba(198,44,36,.22);}
  html[data-theme="dark"] mark.hl{box-shadow:0 0 0 1px var(--h3) inset;filter:saturate(.92) brightness(.86);}
  /* heavy weight */
  b.heavy,strong.heavy{font-weight:800;letter-spacing:-0.012em;}
  .quiz-explain-view{margin-top:9px;padding:10px 12px;border-radius:11px;background:rgba(var(--gold-rgb),0.1);border:1px solid rgba(var(--gold-rgb),0.3);font-family:var(--font-read);font-size:13.5px;line-height:1.6;color:var(--ink-read);}
  .quiz-actions{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .quiz-check-btn{background:var(--g-crimson);border:none;color:#fff;font-weight:700;font-size:14px;padding:10px 20px;border-radius:12px;cursor:pointer;box-shadow:0 8px 18px -4px rgba(20,28,48,0.20),inset 0 1px 0 rgba(255,255,255,0.3);transition:transform .15s var(--spring);}
  .quiz-check-btn:active{transform:scale(.95);}
  .quiz-reset-btn{background:var(--surface);border:var(--edge);color:var(--ink-soft);font-weight:600;font-size:13px;padding:9px 16px;border-radius:12px;cursor:pointer;box-shadow:var(--shadow-xs);transition:transform .15s var(--spring);}
  .quiz-reset-btn:active{transform:scale(.95);}
  .quiz-score{font-family:var(--font-head);font-weight:800;font-size:14px;padding:6px 12px;border-radius:9px;}
  .quiz-score.all-right{color:#2C7A40;background:rgba(62,155,84,0.14);}
  .quiz-score.some-wrong{color:var(--crimson);background:rgba(var(--accent-rgb),0.1);}
  /* quiz editor */
  .quiz-q-head{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
  .quiz-kind{font-family:var(--font-body);font-size:12.5px;font-weight:600;border:var(--edge);border-radius:9px;padding:5px 8px;background:var(--surface);color:var(--ink);cursor:pointer;}
  .quiz-qdel,.quiz-opt-del{border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:12px;margin-left:auto;}

  .quiz-opt-edit{display:flex;align-items:center;gap:10px;padding:6px 0;}
  .quiz-mark{flex-shrink:0;width:22px;height:22px;border-radius:7px;border:2px solid var(--gold);background:var(--surface);cursor:pointer;position:relative;transition:all .15s var(--spring);}
  .quiz-mark.on{background:#3E9B54;border-color:#2C7A40;box-shadow:inset 0 1px 0 rgba(255,255,255,0.25);}
  .quiz-mark.on::after{content:'\2713';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800;}
  .quiz-opt-text{flex:1;font-family:var(--font-read);font-size:14.5px;border:1px dashed var(--line);border-radius:8px;padding:6px 9px;outline:none;color:var(--ink);}
  .quiz-add-opt{font-size:13px;color:var(--crimson);cursor:pointer;font-weight:700;background:none;border:none;padding:6px 0;display:inline-block;}
  .quiz-gap-input{width:100%;min-height:70px;border:1px dashed var(--line);border-radius:10px;padding:9px 11px;font-family:var(--font-read);font-size:14.5px;line-height:1.6;color:var(--ink);background:var(--surface);outline:none;resize:vertical;box-sizing:border-box;}
  .quiz-prompt-input,.quiz-instr-input,.quiz-explain-input{width:100%;border:1px dashed var(--line);border-radius:10px;padding:8px 11px;font-family:var(--font-read);font-size:14.5px;line-height:1.6;color:var(--ink);background:var(--surface);outline:none;resize:vertical;box-sizing:border-box;}
  .quiz-prompt-input{min-height:48px;font-size:15px;font-weight:500;margin-bottom:2px;}
  .quiz-instr-input{min-height:38px;font-style:italic;font-size:13.5px;}

  .quiz-startnum-label{font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;}
  .quiz-startnum{width:70px;border:var(--edge);border-radius:9px;padding:6px 9px;font-family:var(--font-head);font-weight:700;font-size:14px;color:var(--ink);background:var(--surface);outline:none;text-align:center;}
  .quiz-startnum:focus{border-color:var(--gold-bright);}
  .quiz-fmt-hint{font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin:-4px 0 12px;padding:8px 10px;background:rgba(var(--gold-rgb),0.08);border-radius:9px;}

  .quiz-explain-wrap{margin-top:9px;}
  .quiz-explain-label{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}

  .b-toggle{position:relative;}
  .b-toggle{border-radius:14px;transition:background .2s ease;}
  .toggle-head{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:15px;
    padding:9px 12px 9px 10px;margin-left:-2px;border-radius:12px;font-family:var(--font-head);letter-spacing:-0.014em;

  .toggle-head .arrow{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:9px;
    background:transparent;color:var(--ink-soft);flex-shrink:0;

  .toggle-head .arrow svg{width:13px;height:13px;}
  .b-toggle.open > .toggle-head{background:var(--surface);box-shadow:var(--shadow);}
  .b-toggle.open .toggle-head .arrow{transform:rotate(90deg);background:var(--g-crimson);color:#fff;

  .toggle-title{flex:1;min-width:0;}

  @media (prefers-reduced-motion: reduce){ .toggle-head .arrow{transition:none;} }
  .toggle-title{outline:none;}

  @keyframes toggleOpen{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
  @keyframes toggleShut{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-6px);}}
  @media (prefers-reduced-motion: reduce){ .toggle-body{animation:none;} }

  html[data-theme="dark"] .b-callout{box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), inset 0 0 0 1px rgba(255,255,255,0.05), var(--shadow);}

  html[data-theme="dark"] .co-green{background:linear-gradient(150deg,#172E20,#101F16);color:#B4E4C5;} html[data-theme="dark"] .co-green .b-callout-text{color:#B4E4C5;}
  html[data-theme="dark"] .co-blue{background:linear-gradient(150deg,#162840,#0F1B2C);color:#B6D1F3;} html[data-theme="dark"] .co-blue .b-callout-text{color:#B6D1F3;}

  .callout-toolbar{display:flex;align-items:center;gap:14px;margin-top:9px;flex-wrap:wrap;}

  .callout-swatch:active{transform:scale(.85);}

  .callout-emoji-toggle{font-size:11.5px;font-weight:700;color:var(--crimson);cursor:pointer;background:none;border:none;padding:0;}
  .b-quote{position:relative;border-left:none;padding:16px 8px 8px 50px;}

    font-family:var(--font-display);font-size:19.5px;font-weight:500;font-style:italic;

  table.b-table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-xs);font-variant-numeric:tabular-nums;}

  .table-actions{display:flex;gap:16px;margin-top:9px;}

  .embed-label{padding:0 0 10px;font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;}

  .b-embed iframe{width:100%;height:280px;border:none;display:block;border-radius:var(--radius-sm);box-shadow:inset 0 0 0 1px rgba(0,0,0,0.06);}
  .b-embed iframe.video-frame{height:360px;}
  .b-embed iframe.audio-frame{height:90px;}
  .b-embed{
    --plyr-color-main:var(--crimson);

    --plyr-video-control-color-hover:#fff;

    padding:20px;
    transition:transform .2s var(--spring), box-shadow .2s;
  }
  .b-embed .plyr__control--overlaid:hover{
    background:var(--g-crimson);
    transform:translate(-50%,-50%) scale(1.08);
    box-shadow:0 14px 36px -4px rgba(0,0,0,0.6), 0 0 0 9px rgba(233,207,151,0.22), inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .b-embed .plyr__control--overlaid svg{filter:drop-shadow(0 1px 2px rgba(38,14,110,0.5));}
  .clip-empty-hint{font-size:12px;color:var(--ink-soft);line-height:1.5;margin-top:8px;}

  .clip-portrait .plyr{aspect-ratio:9/16;}
  .b-embed .plyr .plyr__video-wrapper{height:100%;}
  .b-embed .plyr video{width:100%;height:100%;object-fit:contain;}
  .b-embed video{object-fit:contain;}
  .orient-row{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap;}
  .orient-label{font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.07em;margin-right:2px;}
  .orient-btn{border:var(--edge);background:var(--surface);border-radius:9px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;box-shadow:var(--shadow-xs);transition:transform .15s var(--spring);}
  .orient-btn:active{transform:scale(.94);}
  .orient-btn.on{background:var(--g-gold);color:#3A2E12;border:none;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,0.4), 0 2px 6px rgba(var(--gold-rgb),0.35);}
  .embed-empty{padding:28px 10px;text-align:center;color:var(--ink-soft);font-size:13px;background:var(--paper);border-radius:var(--radius-sm);border:1px dashed var(--line);}
  .embed-open-row{padding-top:9px;text-align:right;}

  .embed-input{padding-top:10px;display:flex;gap:8px;}

  .embed-input input:focus{outline:none;border-color:var(--gold-bright);box-shadow:var(--focus-ring);}
  .b-image img{width:100%;border-radius:var(--radius-sm);display:block;box-shadow:0 4px 14px rgba(48,40,26,0.14);}

  .move-target{display:block;width:100%;text-align:left;border:none;background:none;padding:9px 8px;font-size:13px;border-radius:10px;cursor:pointer;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .move-target:active{background:var(--line);}
  .add-menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:none;padding:9px 8px;font-size:13.5px;border-radius:10px;cursor:pointer;color:var(--ink);font-weight:600;transition:background .12s;}

  .search-box{position:relative;margin-bottom:16px;}

  .search-row{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:var(--radius-md);background:var(--surface);border:var(--edge);box-shadow:var(--lift),var(--shadow);margin-bottom:10px;cursor:pointer;transition:transform .18s var(--spring);
    opacity:0;animation:unitIn .34s cubic-bezier(.2,.8,.3,1) var(--d,0s) forwards;}

  /* ---- dictionary ---- */

  .dict-note{font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin-top:6px;}

  .settings-input{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13.5px;background:var(--paper);color:var(--ink);width:150px;transition:border-color .15s,box-shadow .15s;}

  .about-credit{font-size:12.5px;color:var(--ink-soft);}
  .about-credit strong{color:var(--ink);}

  .switch{width:38px;height:22px;background:var(--line);border-radius:20px;position:relative;cursor:pointer;transition:background .18s;flex-shrink:0;box-shadow:inset 0 1px 2px rgba(0,0,0,0.10);}

  .switch.on .knob{left:18px;}

  /* ---- floating tab bar ---- */
  .tab-bar{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;display:flex;background:var(--surface-glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border-radius:18px;box-shadow:0 14px 38px -6px rgba(16,22,48,0.24), 0 3px 10px rgba(16,22,48,0.12), inset 0 1px 0 rgba(255,255,255,0.6);padding:7px;border:1px solid rgba(255,255,255,0.5);z-index:90;}

  .search-fab{position:fixed;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,0.45);background:var(--surface-glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:0 10px 26px -6px rgba(20,28,48,0.20), 0 3px 8px rgba(20,28,48,0.10), inset 0 1px 0 rgba(255,255,255,0.55);cursor:pointer;z-index:89;transition:transform .18s var(--spring);}

  @media print{

  /* on this page */
  .toc-card{background:var(--surface);border:var(--edge);border-radius:var(--radius-md);padding:12px 14px;margin:0 0 14px;box-shadow:var(--shadow-xs);}

  /* course progress */

  /* jump back in: horizontal recent-page rail */
  .recent-rail{display:flex;gap:9px;overflow-x:auto;padding:1px 2px 8px;margin:0 -2px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}

  .recent-chip{flex-shrink:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:var(--edge);
    border-radius:999px;padding:8px 13px 8px 9px;cursor:pointer;box-shadow:var(--shadow-xs);max-width:190px;
    transition:transform .16s var(--spring),box-shadow .16s;}

  .accent-row{display:flex;gap:9px;flex-wrap:wrap;padding-top:4px;}

    box-shadow:var(--shadow-xs);transition:transform .16s var(--spring);}

  .a-aurora{background:linear-gradient(145deg,#A78BFF,#5B2BE8 60%,#3A16A8);}

  .search-badge{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#A2823F;border:1px solid var(--gold);border-radius:7px;padding:1.5px 6px;margin-left:7px;vertical-align:2px;white-space:nowrap;}

  /* the panel must never sit on top of the text being edited */
  body.fmt-open .app-scroll{padding-bottom:56vh;}
  /* floating format button, shown while editing */
  #fmtFab{position:fixed;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));width:52px;height:52px;
    border-radius:50%;border:1px solid rgba(255,255,255,0.45);cursor:pointer;z-index:150;

  /* ---- modal ---- */

  @keyframes modalPop{from{opacity:0;transform:scale(.92) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}

    background-size:100% 300%;animation:edgeFlow 7s linear infinite;}

  @media (prefers-reduced-motion: reduce){ .flash-banner::before{animation:none;} }
  .flash-banner-icon{width:42px;height:42px;border-radius:14px;background:var(--g-gold);color:#04323A;font-size:21px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 9px -2px rgba(0,140,152,0.4);flex-shrink:0;}
  .flash-banner-title{font-family:var(--font-head);font-weight:700;font-size:15px;letter-spacing:-0.01em;color:var(--ink);}
  .flash-banner-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;line-height:1.4;}
  .flash-banner-go{margin-left:auto;font-size:19px;color:var(--gold);font-weight:700;}

  .flash-back{background:linear-gradient(158deg,#9E1230,#7E0A22);transform:rotateY(180deg);color:#fff;}
  .flash-word{font-family:var(--font-display);font-size:34px;font-weight:600;color:var(--crimson);letter-spacing:-0.01em;text-wrap:balance;}
  .flash-pos{font-family:var(--font-head);font-size:13px;font-weight:700;color:var(--gold);font-style:italic;margin-top:8px;}

  /* v19: flashcard close button — inside the card, visible on both faces */
