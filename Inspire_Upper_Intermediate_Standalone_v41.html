      html += '<div class="dict-note">Definition from <a href="https://en.wiktionary.org/wiki/'+escapeAttr(dictQuery.trim().toLowerCase().replace(/\s+/g,'_'))+'" target="_blank" style="color:var(--crimson);font-weight:600;">Wiktionary</a> (CC BY-SA).</div>';
    }else if(dictAttribution==='ai'){
      html += '<div class="dict-note">Smart definition written for B1 learners. If a meaning looks unusual, check with your teacher.</div>';
    }
    html += '</div>';
  }

  if(!dictQuery.trim() && !dictLoading && !dictResult && !dictError){
    html += dictArtSVG() + '<div class="empty-note no-mark">Type any English word to see its meaning, examples and pronunciation.</div>';
  }
  return html;
}

function stripTags(html){
  if(!html) return '';
  const d = document.createElement('div');
  d.innerHTML = html;
  return (d.textContent||'').replace(/\s+/g,' ').trim();
}
function hiTerm(text, q){
  const safe = escapeHtml(String(text||''));
  const term = String(q||'').trim();
  if(term.length < 2) return safe;
  try{
    return safe.replace(new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'), '<mark class="hit">$1</mark>');
  }catch(e){ return safe; }
}
function blockTypeLabel(t){
  return {heading:'Heading', text:'Text', callout:'Banner', quote:'Quote', timer:'Timer', reveal:'Answers', gallery:'Gallery', tabs:'Tabs', tabpage:'Tab', bulleted:'List', numbered:'List', tasklist:'Checklist', table:'Table', embed:'Video', audio:'Audio', clip:'Clip', image:'Image', quiz:'Quiz', toggle:'Toggle'}[t] || 'Content';
}
function blockSearchEntries(blocks, out, pageId){
  (blocks||[]).forEach(function(b){
    if(!b) return;
    let txt = '';
    if(b.type==='heading'||b.type==='text'||b.type==='callout') txt = stripTags(b.text);
    else if(b.type==='quote') txt = stripTags(b.text)+' '+stripTags(b.cite);
    else if(b.type==='bulleted'||b.type==='numbered') txt = (b.items||[]).map(stripTags).join(' \u2022 ');
    else if(b.type==='tasklist') txt = (b.items||[]).map(function(i){ return stripTags(i&&i.text); }).join(' \u2022 ');
    else if(b.type==='table') txt = (b.headers||[]).map(stripTags).join(' ')+' '+(b.rows||[]).map(function(r){ return (r||[]).map(stripTags).join(' '); }).join(' ');
    else if(b.type==='embed'||b.type==='audio'||b.type==='clip'||b.type==='image') txt = b.label||'';
    else if(b.type==='quiz'){
      const parts = [b.title||''];
      (b.questions||[]).forEach(function(qq){
        parts.push(qq.instr||'', qq.prompt||'', (qq.options||[]).join(' '), (qq.items||[]).join(' '), qq.explain||'');
      });
      txt = parts.join(' ');
    }else if(isContainer(b)){
      txt = b.title||'';
      blockSearchEntries(b.blocks, out, pageId);
    }
    txt = (txt||'').replace(/\*\*|__|==|[\[\]*]/g,'').replace(/\s+/g,' ').trim();
    if(txt) out.push({pageId:pageId, blockId:b.id, btype:b.type, text:txt});
  });
}
function searchSnippet(text, q){
  const lo = text.toLowerCase();
  const at = lo.indexOf(q);
  if(at<0) return escapeHtml(text.slice(0,80));
  const start = Math.max(0, at-32);
  const end = Math.min(text.length, at+q.length+48);
  return (start>0?'\u2026':'')+escapeHtml(text.slice(start,at))+
    '<mark class="hl">'+escapeHtml(text.slice(at,at+q.length))+'</mark>'+
    escapeHtml(text.slice(at+q.length,end))+(end<text.length?'\u2026':'');
}
function renderSearch(){
  const flat = [];
  (function walk(pages, trail){
    pages.forEach(function(p){
      flat.push({id:p.id, title:p.title, icon:p.icon, trail:trail, blocks:p.blocks});
      if(p.children && p.children.length) walk(p.children, trail.concat([p.title]));
    });
  })(state.pages, []);
  const q = searchQuery.trim().toLowerCase();
  const pageResults = q ? flat.filter(function(f){ return f.title.toLowerCase().indexOf(q)!==-1; }) : flat;
  let contentResults = [];
  if(q){
    flat.forEach(function(f){
      const entries = [];
      blockSearchEntries(f.blocks, entries, f.id);
      entries.forEach(function(e){
        if(e.text.toLowerCase().indexOf(q)!==-1) contentResults.push({page:f, entry:e});
      });
    });
    contentResults = contentResults.slice(0, 40);
  }
  let h = '' +
    '<button class="search-back" onclick="switchTab(\'home\')">\u2190 Back</button>' +
    '<div class="eyebrow" style="margin-bottom:4px;">Find anything</div>' +
    '<div class="big-title serif" style="margin-bottom:16px;">Search</div>' +
    '<div class="search-box"><span class="search-icon">'+iconHTML('search')+'</span>' +
    '<input class="search-input" type="text" placeholder="Search pages, lessons, quizzes\u2026" value="'+escapeAttr(searchQuery)+'" oninput="onSearchInput(this.value)"/></div>' +
    '<div class="search-results">';
  if(pageResults.length){
    if(q) h += '<div class="section-label">Pages</div>';
    h += pageResults.map(function(r,i){
      return '<div class="search-row" style="--d:'+(i*0.035).toFixed(3)+'s" onclick="openFromSearch(\''+r.id+'\')">' +
        '<span class="icon-chip small">'+iconHTML(r.icon)+'</span>' +
        '<div><div class="search-title">'+hiTerm(r.title, q)+'</div>' +
        '<div class="search-path">'+(escapeHtml(r.trail.join(' \u203a '))||'Home')+'</div></div></div>';
    }).join('');
  }
  if(contentResults.length){
    h += '<div class="section-label">In page content</div>';
    h += contentResults.map(function(c,i){
      const p = c.page, e = c.entry;
      return '<div class="search-row" style="--d:'+(i*0.035).toFixed(3)+'s" onclick="openFromSearchBlock(\''+p.id+'\',\''+e.blockId+'\')">' +
        '<span class="icon-chip small">'+iconHTML(p.icon)+'</span>' +
        '<div style="min-width:0;"><div class="search-title">'+hiTerm(p.title, q)+'<span class="search-badge">'+blockTypeLabel(e.btype)+'</span></div>' +
        '<div class="search-snip">'+searchSnippet(e.text, q)+'</div></div></div>';
    }).join('');
  }
  if(!pageResults.length && !contentResults.length){
    h += miniArt('search') + '<div class="empty-note no-mark">Nothing matches \u201c'+escapeHtml(searchQuery)+'\u201d \u2014 try a different word.</div>';
  }
  h += '</div>';
  return h;
}
function openAncestorToggles(blocks, targetId){

}

function renderRootParts(blocks){
  if(!blocks.length) return '<div class="blocks parts"></div>';

  blocks.forEach(function(b, i){
    if(i === 0 || b.newPart){

  if(open) out += '</div>';

}

  render();

/* shared by every way of adding: puts the block in the right spot and sorts out which part it belongs to */
function placeNewBlock(containerId, arr, nb){
  const at = (addMenuInsertAt === null || addMenuInsertAt > arr.length) ? arr.length : addMenuInsertAt;
  if(containerId === 'ROOT'){
    const next = arr[at];
    if(addAsNewPart){
      if(at > 0) nb.newPart = true;
      else if(next){ next.newPart = true; }
    }else if(!addMenuInsertEnd && at > 0 && next && next.newPart){
      /* dropped at the top of a part: the new block becomes that part's first block */
      nb.newPart = true; next.newPart = false;
    }else if(at === 0 && next){
      /* nothing to do: the old first block simply follows in part one */
    }
  }
  arr.splice(at, 0, nb);
  addMenuInsertAt = null; addMenuInsertEnd = false; addAsNewPart = false;
}

        '<span class="task-check" role="checkbox" aria-checked="'+(isDone?'true':'false')+'" onclick="toggleTaskItem(\''+b.id+'\','+idx+')"></span>'+
        '<div class="rich-field task-text" contenteditable="'+editMode+'" data-block-id="'+b.id+'" data-field="taskitems" data-idx="'+idx+'" onfocus="onRichFocus(this)" oninput="onRichInput(this)" onblur="onRichBlur(this)">'+(it.text||'')+'</div>'+
        (editMode ? '<button class="item-del" onclick="deleteTaskItem(\''+b.id+'\','+idx+')">\u2715</button>' : '')+

}
function toggleTaskItem(id, idx){
  const node = findBlockNode(currentPage().blocks, id);
  if(!node || !node.items || !node.items[idx]) return;
  const now = !isTaskDone(id, idx, node.items[idx].done);
  setTaskDone(id, idx, now);
  const host = document.querySelector('[data-bid="'+id+'"] .b-tasklist');
  if(!host){ render(); quietSave(); return; }
  const row = host.querySelectorAll('.task-row')[idx];
  if(row){
    row.classList.toggle('done', now);
    const box = row.querySelector('.task-check');
    if(box) box.setAttribute('aria-checked', now ? 'true' : 'false');
  }
  const items = node.items;
  const done = items.filter(function(i,ix){ return isTaskDone(id, ix, i && i.done); }).length;
  const fill = host.querySelector('.task-prog-bar > span');
  const txt = host.querySelector('.task-prog-txt');
  if(fill) fill.style.width = (items.length ? Math.round((done/items.length)*100) : 0) + '%';
  if(txt) txt.textContent = done + '/' + items.length;
  /* ticks live on this device, so there is nothing to send to the database */
}
function addTaskItem(id){
  const node = findBlockNode(currentPage().blocks, id);
  if(node){ node.items.push({text:'New task', done:false}); persist(); render(); }
}
function deleteTaskItem(id, idx){
  const node = findBlockNode(currentPage().blocks, id);
  if(node){ node.items.splice(idx,1); if(!node.items.length) node.items.push({text:'Task to do',done:false}); persist(); render(); }
}

function romanNum(n){
  const R=[[1000,'m'],[900,'cm'],[500,'d'],[400,'cd'],[100,'c'],[90,'xc'],[50,'l'],[40,'xl'],[10,'x'],[9,'ix'],[5,'v'],[4,'iv'],[1,'i']];
  let s=''; R.forEach(function(p){ while(n>=p[0]){ s+=p[1]; n-=p[0]; } });
  return s;
}

  if(style==='roman') return romanNum(i+1);

}

function countGaps(raw){
  const re = /\[([^\]]*)\]/g; let n=0;
  while(re.exec(raw)) n++;
  return n;
}
function nl2br(s){ return escapeHtml(s).replace(/\n/g,'<br>'); }
function fmtInline(s){
  // escape first, then convert **bold** and *italic* (and __/_ ) markers, then newlines
  let out = escapeHtml(s);
  out = out.replace(/==(yellow|green|blue|pink|purple|orange|red|mint):([^=\n]+)==/g, '<mark class="hl hl-$1">$2</mark>');
  out = out.replace(/==([^=\n]+)==/g, '<mark class="hl hl-yellow">$1</mark>');
  out = out.replace(/\*\*\*([^*]+)\*\*\*/g, '<b class="heavy">$1</b>');
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  out = out.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  out = out.replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>');
  out = out.replace(/\n/g,'<br>');
  return out;
}

function ddOptionsFor(raw){
  const dds = [];
  const re = /\[([^\]]*)\]/g; let m;
  while((m = re.exec(raw))){
    const opts = []; let correct = -1;
    m[1].split(',').forEach(function(s){
      s = s.trim(); if(!s) return;
      if(s.charAt(0)==='*'){ correct = opts.length; s = s.slice(1).trim(); }
      if(s) opts.push(s);
    });
    if(correct<0 && opts.length) correct = 0;
    dds.push({options:opts, correct:correct});
  }
  return dds;
}
function ddPromptHTML(q){
  const raw = q.prompt || '';
  const dds = ddOptionsFor(raw);
  let out = ''; let di = 0;
  const re = /\[([^\]]*)\]/g;
  let last = 0, m;
  while((m = re.exec(raw))){
    out += fmtInline(raw.slice(last, m.index));
    const dd = dds[di] || {options:[],correct:-1};
    out += '<span class="quiz-dd-wrap"><select class="dd-sel" data-di="'+di+'">'+
      '<option value="-1" selected>Choose\u2026</option>'+
      dd.options.map(function(o,oi){ return '<option value="'+oi+'">'+escapeHtml(o)+'</option>'; }).join('')+
    '</select><span class="dd-answer" style="display:none;"></span></span>';
    di++; last = m.index + m[0].length;
  }
  out += fmtInline(raw.slice(last));
  return out;
}
function gapPromptHTML(q, startNum){
  const raw = q.prompt || '';
  let out = '';
  let gi = 0;
  const re = /\[([^\]]*)\]/g;
  let last = 0, m;
  while((m = re.exec(raw))){
    out += fmtInline(raw.slice(last, m.index));
    out += '<span class="quiz-gap-wrap"><input class="quiz-gap" data-gi="'+gi+'" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"/><span class="quiz-gap-answer" style="display:none;"></span></span>';
    gi++; last = m.index + m[0].length;
  }
  out += fmtInline(raw.slice(last));
  return out;
}
function pickQuizOpt(label, multi){
  if(label.closest('.quiz-q').classList.contains('answered')) return;
  if(multi){
    label.classList.toggle('picked');
  }else{
    label.closest('.quiz-q').querySelectorAll('.quiz-opt').forEach(function(o){ o.classList.remove('picked'); });

}
function gapAnswersFor(raw){
  const gaps = [];
  const re = /\[([^\]]*)\]/g; let m;
  while((m = re.exec(raw))){
    gaps.push(m[1].split(',').map(function(s){ return s.trim().toLowerCase(); }).filter(Boolean));
  }
  return gaps;
}
function gapRawFor(raw){
  const gaps = [];
  const re = /\[([^\]]*)\]/g; let m;
  while((m = re.exec(raw))){
    gaps.push(m[1].split(',').map(function(s){ return s.trim(); }).filter(Boolean));
  }
  return gaps;
}
function checkQuiz(id){
  const node = findBlockNode(currentPage().blocks, id);
  const root = document.querySelector('.b-quiz[data-quiz="'+id+'"]');
  if(!node || !root) return;
  let correctCount = 0, total = 0;
  node.questions.forEach(function(q){
    const qEl = root.querySelector('.quiz-q[data-qid="'+q.qid+'"]');
    if(!qEl) return;
    qEl.classList.add('answered');
    let ok = true;
    if(q.kind==='match'){
      const style = q.labelStyle||'alpha';
      const sels = qEl.querySelectorAll('.match-sel');
      sels.forEach(function(sel, i){
        const picked = parseInt(sel.value,10);
        const want = (q.answers||[])[i];
        const good = (want!=null && want>=0 && picked===want);
        sel.classList.toggle('match-right', good);
        sel.classList.toggle('match-wrong', !good);
        sel.disabled = true;
        total++;
        if(good){ correctCount++; }
        else{
          ok = false;
          const wrap = sel.parentNode;
          const ans = wrap && wrap.querySelector('.match-ans');
          if(ans && want!=null && want>=0){
            ans.textContent = matchLabel(style, want);
            ans.style.display = 'block';
          }
        }
      });
    }else if(q.kind==='dd'){
      const dds = ddOptionsFor(q.prompt||'');
      const sels = qEl.querySelectorAll('.dd-sel');
      sels.forEach(function(sel, i){
        const picked = parseInt(sel.value,10);
        const want = (dds[i]||{}).correct;
        const good = (want!=null && want>=0 && picked===want);
        sel.classList.toggle('dd-right', good);
        sel.classList.toggle('dd-wrong', !good);
        sel.disabled = true;
        total++;
        if(good){ correctCount++; }
        else{
          ok = false;
          const wrap = sel.parentNode;
          const ans = wrap && wrap.querySelector('.dd-answer');
          if(ans && want!=null && want>=0){
            ans.textContent = (dds[i].options||[])[want] || '';
            ans.style.display = 'block';
          }
        }
      });
    }else if(q.kind==='gap'){
      const gaps = gapAnswersFor(q.prompt||'');
      const rawGaps = gapRawFor(q.prompt||'');
      const inputs = qEl.querySelectorAll('.quiz-gap');
      inputs.forEach(function(inp, i){
        const val = (inp.value||'').trim().toLowerCase();
        const accepted = gaps[i]||[];
        const good = accepted.indexOf(val)>=0;
        inp.classList.toggle('gap-right', good);
        inp.classList.toggle('gap-wrong', !good);
        inp.disabled = true;
        total++;
        if(good){ correctCount++; }
        else{
          ok = false;
          const wrap = inp.parentNode;
          const ans = wrap && wrap.querySelector('.quiz-gap-answer');
          if(ans){
            const first = (rawGaps[i]||[])[0] || '';
            ans.textContent = first;
            ans.style.display = 'inline';
          }
        }
      });
    }else{
      const correct = (q.correct||[]).slice().sort().join(',');
      const picked = [];
      qEl.querySelectorAll('.quiz-opt').forEach(function(o){
        const oi = parseInt(o.getAttribute('data-oi'),10);
        const isCorrect = (q.correct||[]).indexOf(oi)>=0;
        const isPicked = o.classList.contains('picked');
        if(isPicked) picked.push(oi);
        o.classList.toggle('opt-correct', isCorrect);
        if(isPicked && !isCorrect) o.classList.add('opt-wrong');
      });
      if(picked.slice().sort().join(',') !== correct) ok = false;
      total++;
      if(ok) correctCount++;
    }
    if(ok){ qEl.classList.add('q-right'); }

  if(m = l.match(tlRe('\u25B8\\s+')))    return {indent:indent, kind:'toggle', level:'text', body:m[1]+m[2]};

function ytStartSeconds(u){
  const t = u.searchParams.get('t') || u.searchParams.get('start');
  if(!t) return 0;
  if(/^\d+$/.test(t)) return +t;
  const m = String(t).match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);
  return m ? (+(m[1]||0))*3600 + (+(m[2]||0))*60 + (+(m[3]||0)) : 0;
}
function parseLinkUrl(raw){
  let s = String(raw||'').trim();
  if(!s) return null;
  if(!/^https?:\/\//i.test(s)) s = 'https://' + s;
  let u; try{ u = new URL(s); }catch(e){ return null; }
  if(!/\./.test(u.hostname)) return null;
  const host = u.hostname.replace(/^(www|m)\./, '');
  let m;
  if(host === 'youtu.be'){
    const id = u.pathname.slice(1).split('/')[0];
    if(/^[\w-]{11}$/.test(id)) return {kind:'youtube', ytId:id, shorts:false, start:ytStartSeconds(u), url:u.href};
  }
  if(host === 'youtube.com' || host === 'music.youtube.com' || host === 'youtube-nocookie.com'){
    let id = u.searchParams.get('v'), shorts = false;
    if(!id && (m = u.pathname.match(/^\/(shorts|embed|live|v)\/([\w-]{11})/))){ id = m[2]; shorts = m[1] === 'shorts'; }
    if(id && /^[\w-]{11}$/.test(id)) return {kind:'youtube', ytId:id, shorts:shorts, start:ytStartSeconds(u), url:u.href};
  }
  if(host === 'drive.google.com'){
    m = u.pathname.match(/\/file\/d\/([\w-]{10,})/);
    const id = m ? m[1] : u.searchParams.get('id');
    if(id) return {kind:'drive', driveId:id, driveType:'file', published:false, url:u.href};
  }
  if(host === 'docs.google.com'){
    m = u.pathname.match(/^\/(presentation|document|spreadsheets|forms)\/d\/(e\/)?([\w-]{10,})/);
    if(m) return {kind:'drive', driveId:m[3], driveType:m[1], published:!!m[2], url:u.href};
  }
  return {kind:'web', url:u.href};
}
function driveFileKind(b){
  const map = {presentation:'slides', document:'doc', spreadsheets:'sheet', forms:'form'};
  if(map[b.driveType]) return map[b.driveType];
  const t = String(b.title||'').toLowerCase();
  if(/\.pdf\b/.test(t)) return 'pdf';
  if(/\.(pptx?|key|odp)\b/.test(t)) return 'slides';
  if(/\.(docx?|odt|rtf|txt)\b/.test(t)) return 'doc';
  if(/\.(xlsx?|csv|ods)\b/.test(t)) return 'sheet';
  if(/\.(mp4|mov|m4v|webm)\b/.test(t)) return 'video';
  if(/\.(jpe?g|png|gif|webp|heic)\b/.test(t)) return 'image';
  return t ? 'file' : 'pdf';
}
function driveThumb(b){ return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(b.driveId)+'&sz=w1200'; }
function drivePreviewSrc(b){
  const id = encodeURIComponent(b.driveId), e = b.published ? 'e/' : '';
  switch(b.driveType){
    case 'presentation': return 'https://docs.google.com/presentation/d/'+e+id+'/embed?start=false&loop=false';
    case 'document': return b.published ? 'https://docs.google.com/document/d/e/'+id+'/pub?embedded=true' : 'https://docs.google.com/document/d/'+id+'/preview';
    case 'spreadsheets': return b.published ? 'https://docs.google.com/spreadsheets/d/e/'+id+'/pubhtml?widget=true' : 'https://docs.google.com/spreadsheets/d/'+id+'/preview';
    case 'forms': return 'https://docs.google.com/forms/d/'+e+id+'/viewform?embedded=true';
    default: return 'https://drive.google.com/file/d/'+id+'/preview';
  }
}
function linkHost(url){ try{ return new URL(url).hostname.replace(/^www\./,''); }catch(e){ return ''; } }
function faviconFor(url){ const h = linkHost(url); return h ? 'https://www.google.com/s2/favicons?domain='+encodeURIComponent(h)+'&sz=64' : ''; }
function cleanDriveTitle(t){ return String(t||'').replace(/\s+[-\u2013]\s+Google (Drive|Slides|Docs|Sheets|Forms)$/i,'').trim(); }

function setLinkUrl(id, raw){
  const node = findBlockNode(currentPage().blocks, id);
  if(!node) return;
  const p = parseLinkUrl(raw);
  if(!p){ if(String(raw||'').trim()) flashToast('That does not look like a link'); return; }
  if(p.url === node.url && node.kind) { fetchLinkMeta(id, true); return; }
  ['ytId','shorts','start','driveId','driveType','published','title','desc','image','site','icon','author','titleEdited','descEdited'].forEach(function(k){ delete node[k]; });
  Object.assign(node, p);
  persist(); render();
  fetchLinkMeta(id, false);
}
function fetchLinkMeta(id, manual){
  const node = findBlockNode(currentPage().blocks, id);
  if(!node || !node.url) return;
  linkFetching[id] = true; render();
  const target = node.kind === 'drive'
    ? (node.driveType === 'file' ? 'https://drive.google.com/file/d/'+node.driveId+'/view' : node.url)
    : node.url;
  fetch(LINK_FN_URL + '?url=' + encodeURIComponent(target), { headers:{ apikey:SUPABASE_KEY } })
    .then(function(r){ return r.json(); })
    .then(function(d){
      const n = findBlockNode(currentPage().blocks, id);
      if(!n) return;
      if(d && !d.error){
        const t = n.kind === 'drive' ? cleanDriveTitle(d.title) : (d.title || '');
        if(t && !n.titleEdited) n.title = t;
        if(n.kind === 'web'){
          if(d.description && !n.descEdited) n.desc = d.description;
          n.image = d.image || ''; n.site = d.siteName || ''; n.icon = d.icon || '';
        }
        if(n.kind === 'youtube') n.author = d.author || '';
        persist();
        if(manual) flashToast('Preview updated');
      }else if(manual){
        flashToast('This site did not share a preview');
      }
    })
    .catch(function(){ if(manual) flashToast('Could not reach the preview service'); })
    .then(function(){ delete linkFetching[id]; render(); });
}

function handleGalleryUpload(blockId, input){
  const files = Array.from(input.files || []);
  if(!files.length) return;
  let pending = files.length;
  flashToast('Adding ' + files.length + ' image' + (files.length===1?'':'s') + '…');
  files.forEach(function(file){
    uploadImageFile(file, function(key){
      if(key){
        const node = findBlockNode(currentPage().blocks, blockId);
        if(node){ node.imgKeys = node.imgKeys || []; node.imgKeys.push(key); }
      }else{
        alert('One image could not be saved.');
      }
      if(--pending === 0){ persist(); render(); }
    });
  });
  input.value = '';
}
function removeGalleryImage(id, i){

function moveGalleryImage(id, i, dir){

/* ---------- countdown timer ---------- */
const TIMER_PRESETS = [1,2,3,5,10,15,20];
const timerRT = {};
function timerState(b){
  const total = Math.max(1, (b.mins||5)) * 60;
  let t = timerRT[b.id];
  if(!t || t.total !== total){ t = timerRT[b.id] = {left:total, total:total, running:false}; }
  return t;
}
function timerFace(sec){
  const s = Math.max(0, Math.round(sec));
  const m = Math.floor(s/60);
  return (m<10?'0':'')+m+':'+((s%60)<10?'0':'')+(s%60);
}
function timerHTML(b){
  const t = timerState(b);
  const R = 34, C = 2*Math.PI*R;
  const frac = t.total ? t.left/t.total : 0;
  return '<div class="b-timer" data-tid="'+b.id+'">' +
    '<div class="tm-ring-wrap">' +
      '<svg class="tm-ring" viewBox="0 0 80 80">' +
        '<circle class="tm-track" cx="40" cy="40" r="'+R+'"/>' +
        '<circle class="tm-fill" cx="40" cy="40" r="'+R+'" style="stroke-dasharray:'+C.toFixed(1)+';stroke-dashoffset:'+((1-frac)*C).toFixed(1)+';"/>' +
      '</svg>' +
      '<div class="tm-face">'+timerFace(t.left)+'</div>' +
    '</div>' +
    '<div class="tm-body">' +
      '<div class="tm-label" contenteditable="'+editMode+'" onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur();}" oninput="onBlockField(\''+b.id+'\',\'label\',this.innerText)" onblur="render()">'+escapeHtml(b.label||'Timed task')+'</div>' +
      '<div class="tm-controls">' +
        '<button class="tm-btn primary" onclick="timerToggle(\''+b.id+'\')">'+(t.running?'Pause':'Start')+'</button>' +
        '<button class="tm-btn" onclick="timerReset(\''+b.id+'\')">Reset</button>' +
      '</div>' +
      (editMode ? ('<div class="tm-presets">' + TIMER_PRESETS.map(function(m){
        return '<button class="tm-preset'+((b.mins||5)===m?' on':'')+'" onclick="setTimerMins(\''+b.id+'\','+m+')">'+m+'m</button>';
      }).join('') + '</div>') : '') +
    '</div>' +
  '</div>';
}
function setTimerMins(id, mins){
  const node = findBlockNode(currentPage().blocks, id);
  if(!node) return;
  node.mins = mins;
  delete timerRT[id];
  persist(); render();
}
function timerPaint(id){
  const host = document.querySelector('[data-tid="'+id+'"]');
  const t = timerRT[id];
  if(!host || !t) return;
  const face = host.querySelector('.tm-face');
  if(face) face.textContent = timerFace(t.left);
  const fill = host.querySelector('.tm-fill');
  if(fill){
    const C = 2*Math.PI*34;
    fill.style.strokeDashoffset = ((1 - (t.total ? t.left/t.total : 0)) * C).toFixed(1);
  }
  const btn = host.querySelector('.tm-btn.primary');
  if(btn) btn.textContent = t.running ? 'Pause' : 'Start';
  host.classList.toggle('running', !!t.running);
  host.classList.toggle('done', t.left <= 0);
}
function timerToggle(id){
  const t = timerRT[id];
  if(!t) return;
  if(t.left <= 0){ t.left = t.total; }
  t.running = !t.running;
  t.at = Date.now();
  timerPaint(id);
}
function timerReset(id){
  const t = timerRT[id];
  if(!t) return;
  t.left = t.total; t.running = false;
  timerPaint(id);
}
function timerChime(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    [0, 0.18, 0.36].forEach(function(d){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + d);
      g.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + d + 0.16);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 0.2);
    });
    setTimeout(function(){ try{ ctx.close(); }catch(e){} }, 1200);
  }catch(e){}
}
setInterval(function(){
  Object.keys(timerRT).forEach(function(id){
    const t = timerRT[id];
    if(!t.running) return;
    const now = Date.now();
    t.left -= (now - (t.at||now)) / 1000;
    t.at = now;
    if(t.left <= 0){ t.left = 0; t.running = false; timerChime(); }
    timerPaint(id);
  });
}, 250);

function savePageTemplate(pageId){
  const page = findPage(state.pages, pageId);
  if(!page) return;
  const name = prompt('Save this page\u2019s layout as a template.\nYou can then copy it into other units (Use a template) or start new pages from it.\n\nName it:', page.title);
  if(!name || !name.trim()) return;
  const list = pageTemplates();
  const same = list.find(function(t){ return t.name.toLowerCase() === name.trim().toLowerCase(); });
  const tpl = { id: same ? same.id : uid(), name: name.trim(), icon: page.icon, blocks: JSON.parse(JSON.stringify(page.blocks || [])), savedAt: Date.now() };
  if(same){
    if(!confirm('You already have a template called \u201C'+same.name+'\u201D. Update it with this page?')) return;
    list[list.indexOf(same)] = tpl;
  }else{
    list.push(tpl);

  persist(); render();
  flashToast('Template saved');

  const page = findPage(state.pages, applyTplFor);
  const t = pageTemplates().find(function(x){ return x.id === applyTplPick; });
  if(!page || !t) return;
  const copy = JSON.parse(JSON.stringify(t.blocks || [])).map(reidBlock);
  if(applyTplMode === 'replace'){
    if((page.blocks||[]).length && !confirm('Replace everything on \u201C'+page.title+'\u201D with the \u201C'+t.name+'\u201D template? The current blocks on this page will be removed.')) return;
    page.blocks = copy;
  }else{
    if(copy.length && (page.blocks||[]).length) copy[0].newPart = true;   /* the copy starts as its own part */
    page.blocks = (page.blocks || []).concat(copy);

function renderMoveModal(){
  if(moveChoosingPage) return renderMovePagePicker();
  const sourcePage = currentPage();
  const moving = findBlockNode(sourcePage.blocks, moveBlockId);
  if(!moving) return '';
  const destPage = getMoveTargetPage();
  const isSamePage = destPage.id === sourcePage.id;
  const excludeIds = [];
  collectSubtreeIds(moving, excludeIds);
  const flat = [];
  flattenBlocksForMove(destPage.blocks, 0, flat, excludeIds);
  return '<div class="modal-overlay" onclick="if(event.target===this)cancelMoveBlock()">' +
    '<div class="modal modal-lg"><h3>Move block</h3>' +
    '<div class="hint">Moving: '+escapeHtml(blockPreviewLabel(moving))+'</div>' +

    '<div class="move-target-list">' +
      '<button class="move-target" onclick="confirmMoveTo(null)">↥ Move to the very top of '+(isSamePage?'this page':escapeHtml(destPage.title))+'</button>' +
      flat.map(function(item){
        return '<button class="move-target" style="padding-left:'+(14+item.depth*16)+'px" onclick="confirmMoveTo(\''+item.id+'\')">↳ After: '+escapeHtml(item.label)+'</button>';

    '</div>' +
    '<div class="modal-actions"><span></span><span class="right-group"><button class="btn" onclick="cancelMoveBlock()">Cancel</button></span></div>' +
    '</div></div>';
}
function renderMovePagePicker(){
  const flat = [];
  flattenAllPages(state.pages, [], flat);
  const curId = currentPage().id;
  return '<div class="modal-overlay" onclick="if(event.target===this)cancelMoveBlock()">' +
    '<div class="modal modal-lg"><h3>Move to which page?</h3>' +
    '<div class="move-target-list">' +
      flat.map(function(p){
        const path = p.trail.length ? (p.trail.join(' › ')+' › '+p.title) : p.title;
        return '<button class="move-target" onclick="pickMoveTargetPage(\''+p.id+'\')">'+(p.id===curId?'📍 ':'📄 ')+escapeHtml(path)+(p.id===curId?' (current page)':'')+'</button>';
      }).join('') +
    '</div>' +
    '<div class="modal-actions"><span></span><span class="right-group"><button class="btn" onclick="cancelMoveBlock()">Cancel</button></span></div>' +
    '</div></div>';
}
